        function clearGroup(group) {

        function refreshInteractivePickables() {
            interactivePickables = [];
            const activeUnits = STATE.dualMode ? [unit1, unit2] : [unit1];
            activeUnits.forEach(u => {
                u.nucleons.forEach(m => interactivePickables.push(m));

        function rebuildAtomModel(unit = unit1) {
            const def = ELEMENT_DEFS[unit.elementKey];

            clearGroup(unit.nucleusGroup);
            clearGroup(unit.shellsRootGroup);
            unit.labelElements.forEach(item => item.el.remove());
            unit.nucleons = [];
            unit.shellObjects = [];
            unit.allElectrons = [];
            unit.labelElements = [];

            // ------------------------------------------------------------------------
            // 5A. NUCLEUS
            // ------------------------------------------------------------------------
            const nucleonRadius = def.nucleonRadius;
            const nucleonGeo = new THREE.SphereGeometry(nucleonRadius, 24, 24);
            const totalNucleons = def.protons + def.neutrons;

            if (totalNucleons === 1) {
                const mesh = new THREE.Mesh(nucleonGeo, protonMat);
                mesh.position.set(0, 0, 0);
                mesh.castShadow = true;
                mesh.userData = {
                    type: 'proton',
                    basePos: new THREE.Vector3(0, 0, 0),
                    phase: 0,
                    caption: `陽子 (Proton, p⁺) ： 正電荷(+1)をもつ粒子。${def.name}の原子核は陽子1個のみで構成されています`
                };
                unit.nucleusGroup.add(mesh);
                unit.nucleons.push(mesh);
            } else {
                const simPts = [];
                const goldenAngle = Math.PI * (3 - Math.sqrt(5));
                for (let i = 0; i < totalNucleons; i++) {
                    const r = i < 8 ? 0.34 : 0.72;
                    const y = 1 - (i / (totalNucleons - 1)) * 2;
                    const rad = Math.sqrt(Math.max(0, 1 - y * y));
                    const theta = goldenAngle * i;
                    simPts.push(new THREE.Vector3(
                        Math.cos(theta) * rad * r,
                        y * r,
                        Math.sin(theta) * rad * r
                    ));
                }

                const minSep = nucleonRadius * 1.82;
                for (let iter = 0; iter < 180; iter++) {
                    for (let i = 0; i < totalNucleons; i++) {
                        simPts[i].multiplyScalar(0.965);
                    }
                    for (let i = 0; i < totalNucleons; i++) {
                        for (let j = i + 1; j < totalNucleons; j++) {
                            const diff = new THREE.Vector3().subVectors(simPts[i], simPts[j]);
                            const dist = diff.length();
                            if (dist < minSep && dist > 0.0001) {
                                const push = (minSep - dist) * 0.52;
                                diff.normalize().multiplyScalar(push);
                                simPts[i].add(diff);
                                simPts[j].sub(diff);
                            }
                        }
                    }
                }

                const centerOffset = new THREE.Vector3();
                simPts.forEach(p => centerOffset.add(p));
                centerOffset.divideScalar(totalNucleons);
                simPts.forEach(p => p.sub(centerOffset));

                const isProtonArr = new Array(totalNucleons).fill(false);
                for (let i = 0; i < totalNucleons; i += 2) isProtonArr[i] = true;

                for (let pass = 0; pass < 80; pass++) {
                    let improved = false;
                    for (let i = 0; i < totalNucleons; i++) {
                        if (!isProtonArr[i]) continue;
                        for (let j = 0; j < totalNucleons; j++) {
                            if (isProtonArr[j]) continue;

                            let energyBefore = 0;
                            let energyAfter = 0;
                            for (let k = 0; k < totalNucleons; k++) {
                                if (k === i || k === j || !isProtonArr[k]) continue;
                                energyBefore += 1 / simPts[i].distanceTo(simPts[k]);
                                energyAfter += 1 / simPts[j].distanceTo(simPts[k]);
                            }
                            if (energyAfter < energyBefore - 0.0001) {
                                isProtonArr[i] = false;
                                isProtonArr[j] = true;
                                improved = true;
                                break;
                            }
                        }
                    }
                    if (!improved) break;
                }

                for (let i = 0; i < totalNucleons; i++) {
                    const isProton = isProtonArr[i];
                    const mesh = new THREE.Mesh(nucleonGeo, isProton ? protonMat : neutronMat);
                    mesh.position.copy(simPts[i]);
                    mesh.castShadow = true;
                    mesh.userData = {
                        type: isProton ? 'proton' : 'neutron',
                        basePos: simPts[i].clone(),
                        phase: i * 0.77,
                        caption: isProton
                            ? `陽子 (Proton, p⁺) ： 正電荷(+1)をもつ粒子。${def.name}の原子核には${def.protons}個あります`
                            : '中性子 (Neutron, n⁰) ： 電荷をもたない粒子。陽子同士の反発を抑え原子核を安定させます'
                    };
                    unit.nucleusGroup.add(mesh);
                    unit.nucleons.push(mesh);
                }
            }

            // ------------------------------------------------------------------------
            // 5B. CONCENTRIC ELECTRON SHELLS & 3D SPHERICAL ELECTRONS
            // ------------------------------------------------------------------------
            def.shells.forEach((cfg, shellIdx) => {
                const shellGroup = new THREE.Group();
                unit.shellsRootGroup.add(shellGroup);

                const cutawayPhiStart = Math.PI * 0.18;
                const cutawayPhiLength = Math.PI * 1.55;
                const shellCutGeo = new THREE.SphereGeometry(
                    cfg.radius, 44, 32, cutawayPhiStart, cutawayPhiLength, 0, Math.PI
                );
                const shellCutMat = new THREE.MeshPhysicalMaterial({
                    color: cfg.hex,
                    transparent: true,
                    opacity: 0.18,
                    roughness: 0.18,
                    metalness: 0.05,
                    side: THREE.DoubleSide,
                    depthWrite: false
                });
                shellGroup.add(new THREE.Mesh(shellCutGeo, shellCutMat));

                const edgeGroup = new THREE.Group();
                const edgeMat = new THREE.LineBasicMaterial({
                    color: cfg.hex,
                    transparent: true,
                    opacity: 0.58
                });

                const eqPts = [];
                const segs = 72;
                for (let s = 0; s <= segs; s++) {
                    const phi = cutawayPhiStart + (s / segs) * cutawayPhiLength;
                    eqPts.push(new THREE.Vector3(-cfg.radius * Math.cos(phi), 0, cfg.radius * Math.sin(phi)));
                }
                edgeGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(eqPts), edgeMat));

                [cutawayPhiStart, cutawayPhiStart + cutawayPhiLength].forEach(boundaryPhi => {
                    const exactArcPts = [];
                    for (let s = 0; s <= 48; s++) {
                        const theta = (s / 48) * Math.PI;
                        exactArcPts.push(new THREE.Vector3(
                            -cfg.radius * Math.cos(boundaryPhi) * Math.sin(theta),
                            cfg.radius * Math.cos(theta),
                            cfg.radius * Math.sin(boundaryPhi) * Math.sin(theta)
                        ));
                    }
                    edgeGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(exactArcPts), edgeMat));
                });

                shellGroup.add(edgeGroup);

                const eGeo = new THREE.SphereGeometry(0.24, 24, 24);
                const eMat = new THREE.MeshStandardMaterial({
                    color: cfg.electronHex,
                    emissive: cfg.hex,
                    emissiveIntensity: 0.35,
                    roughness: 0.2,
                    metalness: 0.1
                });

                const haloGeo = new THREE.SphereGeometry(0.38, 16, 16);
                const haloMat = new THREE.MeshBasicMaterial({
                    color: cfg.electronHex,
                    transparent: true,
                    opacity: 0.28,
                    depthWrite: false
                });

                const gAngle = Math.PI * (3 - Math.sqrt(5));
                for (let i = 0; i < cfg.electronCount; i++) {
                    const eMesh = new THREE.Mesh(eGeo, eMat);
                    eMesh.add(new THREE.Mesh(haloGeo, haloMat));

                    const ny = 1 - ((i + 0.5) / cfg.electronCount) * 2;
                    const nRad = Math.sqrt(Math.max(0, 1 - ny * ny));
                    const nTheta = i * gAngle + shellIdx * 1.3;
                    const orbitNormal = new THREE.Vector3(
                        Math.cos(nTheta) * nRad,
                        ny,
                        Math.sin(nTheta) * nRad
                    ).normalize();

                    const refUp = Math.abs(orbitNormal.y) < 0.85
                        ? new THREE.Vector3(0, 1, 0)
                        : new THREE.Vector3(1, 0, 0);
                    const uVec = new THREE.Vector3().crossVectors(orbitNormal, refUp).normalize();
                    const vVec = new THREE.Vector3().crossVectors(orbitNormal, uVec).normalize();

                    const ejectDir = new THREE.Vector3(
                        i === 0 ? 0.78 : -0.72,
                        0.55,
                        i === 0 ? 0.35 : -0.42
                    ).normalize();

                    eMesh.userData = {
                        type: 'electron',
                        shellName: cfg.name,
                        caption: `${cfg.name}の電子 (e⁻) ： ${cfg.desc}`
                    };

                    shellGroup.add(eMesh);

                    unit.allElectrons.push({
                        mesh: eMesh,
                        haloMat,
                        shellIdx,
                        baseRadius: cfg.radius,
                        orbitNormal,
                        uVec,
                        vVec,
                        phase: (i / cfg.electronCount) * Math.PI * 2 + shellIdx * 0.9,
                        angularSpeed: (1.55 - shellIdx * 0.24) * (0.88 + (i % 3) * 0.14) * (i % 2 === 0 ? 1 : -1),
                        precessionAngle: i * 1.2,
                        precessionSpeed: 0.35 + (i % 4) * 0.08,
                        ejectDir,
                        isGainedElectron: false
                    });
                }

                // For anion-forming elements (e.g., Cl -> Cl-), add the incoming external electron (single mode)
                if (def.ionMode === 'gain' && shellIdx === def.valenceShellIdx) {
                    const gainMat = new THREE.MeshStandardMaterial({
                        color: 0xff4da6,
                        emissive: 0xff007f,
                        emissiveIntensity: 0.45,
                        roughness: 0.2,
                        metalness: 0.1,
                        transparent: true,
                        opacity: 0.45
                    });
                    const gainHaloMat = new THREE.MeshBasicMaterial({
                        color: 0xff4da6,
                        transparent: true,
                        opacity: 0.22,
                        depthWrite: false
                    });
                    const gainMesh = new THREE.Mesh(eGeo, gainMat);
                    gainMesh.add(new THREE.Mesh(haloGeo, gainHaloMat));

                    const orbitNormal = new THREE.Vector3(0.45, 0.72, 0.52).normalize();
                    const uVec = new THREE.Vector3().crossVectors(orbitNormal, new THREE.Vector3(1, 0, 0)).normalize();
                    const vVec = new THREE.Vector3().crossVectors(orbitNormal, uVec).normalize();
                    const ejectDir = new THREE.Vector3(0.75, 0.45, 0.48).normalize();

                    gainMesh.userData = {
                        type: 'electron',
                        shellName: cfg.name,
                        caption: '外から受け取る電子 (e⁻) ： Cl⁻イオンになるときM殻の8個目として取り込まれます'
                    };

                    shellGroup.add(gainMesh);

                    unit.allElectrons.push({
                        mesh: gainMesh,
                        eMat: gainMat,
                        haloMat: gainHaloMat,
                        shellIdx,
                        baseRadius: cfg.radius,
                        orbitNormal,
                        uVec,
                        vVec,
                        phase: 0.8,
                        angularSpeed: 1.05,
                        precessionAngle: 0.5,
                        precessionSpeed: 0.4,
                        ejectDir,
                        isGainedElectron: true
                    });
                }

                unit.shellObjects.push({
                    cfg,
                    shellIdx,
                    shellGroup,
                    shellCutMat,
                    edgeMat
                });

                // 3D Floating Label
                const el = document.createElement('div');
                el.className = 'label-3d px-2.5 py-0.5 rounded-full text-xs font-black text-white shadow-md border border-white/30';
                el.style.backgroundColor = cfg.badgeBg;
                el.textContent = `${cfg.name} (${cfg.electronCount})`;
                labelsContainer.appendChild(el);

                unit.labelElements.push({
                    el,
                    cfg,
                    shellIdx,
                    localPos: new THREE.Vector3(0, cfg.radius + 0.32, 0)
                });
            });

            refreshInteractivePickables();
        }

        rebuildAtomModel(unit1);
        rebuildAtomModel(unit2);

        function getDualReactionPair() {
            if (!STATE.dualMode) return null;
            const { left, right } = STATE.dualElements;
            if ((left === 'h' && right === 'cl') || (left === 'cl' && right === 'h')) return 'hcl';
            if ((left === 'na' && right === 'cl') || (left === 'cl' && right === 'na')) return 'nacl';
            return null;
        }

        function isHclPair() {
            return getDualReactionPair() !== null;
        }

        function update3DLabels() {
            const halfW = window.innerWidth / 2;
            const halfH = window.innerHeight / 2;
            const worldPos = new THREE.Vector3();
            const pairType = getDualReactionPair();
            const hclActive = pairType !== null;

            UNITS.forEach((unit, uIdx) => {
                const visibleUnit = uIdx === 0 || STATE.dualMode;
                const def = ELEMENT_DEFS[unit.elementKey];

                unit.labelElements.forEach(item => {
                    if (!visibleUnit) {
                        item.el.style.opacity = '0';
                        return;
                    }

                    worldPos.copy(item.localPos).add(unit.atomGroup.position);
                    worldPos.project(camera);

                    if (worldPos.z > 1.0) {
                        item.el.style.opacity = '0';
                        return;
                    }

                    item.el.style.left = `${(worldPos.x * halfW) + halfW}px`;
                    item.el.style.top = `${-(worldPos.y * halfH) + halfH}px`;

                    if (STATE.dualMode && hclActive) {
                        if (def.key === 'na' && item.shellIdx === 1) {
                            if (STATE.hclStage === 'bonded' || STATE.hclStage === 'ionized') {
                                item.el.textContent = 'Na⁺ L殻 (8・安定)';
                                item.el.style.opacity = '0.96';
                            } else {
                                item.el.textContent = 'L殻 (8)';
                                item.el.style.opacity = '0.9';
                            }
                        } else if (item.shellIdx === def.valenceShellIdx) {
                            if (def.key === 'h') {
                                if (STATE.hclStage === 'ionized') {
                                    item.el.textContent = 'H⁺ (陽子1・e⁻ 0)';
                                    item.el.style.opacity = '0.95';
                                } else if (STATE.hclStage === 'bonded') {
                                    item.el.textContent = 'K殻 (共有中)';
                                    item.el.style.opacity = '0.92';
                                } else {
                                    item.el.textContent = 'K殻 (1)';
                                    item.el.style.opacity = '0.92';
                                }
                            } else if (def.key === 'na') {
                                if (STATE.hclStage === 'bonded' || STATE.hclStage === 'ionized') {
                                    item.el.textContent = 'Na⁺ M殻 (放出・0)';
                                    item.el.style.opacity = '0.35';
                                } else {
                                    item.el.textContent = 'M殻 (1)';
                                    item.el.style.opacity = '0.92';
                                }
                            } else if (def.key === 'cl') {
                                if (STATE.hclStage === 'ionized' || (pairType === 'nacl' && STATE.hclStage === 'bonded')) {
                                    item.el.textContent = 'Cl⁻ M殻 (8・安定)';
                                } else if (STATE.hclStage === 'bonded') {
                                    item.el.textContent = 'M殻 (共有で8)';
                                } else {
                                    item.el.textContent = 'M殻 (7)';
                                }
                                item.el.style.opacity = '0.94';
                            }
                        } else {
                            item.el.textContent = `${item.cfg.name} (${item.cfg.electronCount})`;
                            item.el.style.opacity = '0.9';
                        }
                    } else if (!STATE.dualMode && item.shellIdx === def.valenceShellIdx) {
                        if (def.ionMode === 'gain') {
                            item.el.textContent = STATE.isIonized
                                ? `${item.cfg.name} (${item.cfg.electronCount + 1}・安定)`
                                : `${item.cfg.name} (${item.cfg.electronCount})`;
                            item.el.style.opacity = '0.94';
                        } else {
                            item.el.textContent = STATE.isIonized
                                ? `${item.cfg.name} (放出・0個)`
                                : `${item.cfg.name} (${item.cfg.electronCount})`;
                            item.el.style.opacity = String(1 - STATE.ionizationProgress * 0.65);
                        }
                    } else {
                        item.el.textContent = `${item.cfg.name} (${item.cfg.electronCount})`;
                        item.el.style.opacity = '0.92';
                    }
                });
            });

            // Shared covalent / ionic bond badge
            if (STATE.dualMode && hclActive && STATE.hclBondProgress > 0.15) {
                sharedBondBadge.textContent = pairType === 'nacl' ? '🔗 イオン結合 (Na⁺Cl⁻)' : '🔗 共有電子対 (H−Cl)';
                worldPos.copy(sharedBondGroup.position).add(new THREE.Vector3(0, 1.9, 0));
                worldPos.project(camera);
                if (worldPos.z <= 1.0) {
                    sharedBondBadge.style.left = `${(worldPos.x * halfW) + halfW}px`;
                    sharedBondBadge.style.top = `${-(worldPos.y * halfH) + halfH}px`;
                    sharedBondBadge.style.opacity = String(Math.min(1, STATE.hclBondProgress));
                } else {
                    sharedBondBadge.style.opacity = '0';
                }
            } else {
                sharedBondBadge.style.opacity = '0';
            }
        }

        // ============================================================================
        // 7. CAMERA PRESET, ELEMENT SWITCH & IONIZATION CONTROLLERS
        // ============================================================================
        function setCaptionText(text) {
            const capEl = document.getElementById('caption-text');
            if (capEl) capEl.textContent = text;
        }

        function getUnitHomeAtomPos(unit) {
            return new THREE.Vector3(ATOM_CENTER.x + unit.targetBookX, ATOM_CENTER.y, ATOM_CENTER.z);
        }

        function updateShellMaterialsAndVisibility() {
            const pairType = getDualReactionPair();
            const hclActive = pairType !== null;
            if (STATE.dualMode && hclActive) {
                const donorUnit = (unit1.elementKey === 'h' || unit1.elementKey === 'na') ? unit1 : unit2;
                const clUnit = donorUnit === unit1 ? unit2 : unit1;
                const donorValenceIdx = ELEMENT_DEFS[donorUnit.elementKey].valenceShellIdx;
                const donorShell = donorUnit.shellObjects[donorValenceIdx];
                if (donorShell) {
                    const fadeAmount = donorUnit.elementKey === 'na'
                        ? Math.max(STATE.hclBondProgress, STATE.hclIonizeProgress)
                        : STATE.hclIonizeProgress;
                    const fade = 1.0 - fadeAmount * 0.85;
                    donorShell.shellCutMat.opacity = 0.18 * fade;
                    donorShell.edgeMat.opacity = 0.58 * fade;
                }
                const clValence = clUnit.shellObjects[2];
                if (clValence) {
                    const boost = Math.max(STATE.hclBondProgress, STATE.hclIonizeProgress);
                    clValence.shellCutMat.opacity = 0.18 + boost * 0.08;
                    clValence.edgeMat.opacity = 0.58 + boost * 0.25;
                }
                return;
            }

            const unitsToUpdate = STATE.dualMode ? UNITS : [unit1];
            unitsToUpdate.forEach(unit => {
                const def = ELEMENT_DEFS[unit.elementKey];
                const valenceShell = unit.shellObjects[def.valenceShellIdx];
                if (valenceShell) {
                    if (def.ionMode === 'gain') {
                        valenceShell.shellCutMat.opacity = 0.18 + STATE.ionizationProgress * 0.08;
                        valenceShell.edgeMat.opacity = 0.58 + STATE.ionizationProgress * 0.25;
                    } else {
                        const fade = 1.0 - STATE.ionizationProgress * 0.82;
                        valenceShell.shellCutMat.opacity = 0.18 * fade;
                        valenceShell.edgeMat.opacity = 0.58 * fade;
                    }
                }
            });
        }

        function moveToCameraPreset(presetKey) {
            const preset = CAMERA_PRESETS[presetKey];
            const def = getActiveDef();
            if (!preset) return;

            STATE.currentCamPreset = presetKey;
            STATE.highlightedChapter = preset.chapter;

            document.querySelectorAll('.cam-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.cam === presetKey);
            });

            if (!STATE.dualMode) {
                setCaptionText(def.captions[presetKey] || def.captions.overview);
                renderLeftPageTexture(STATE.highlightedChapter, STATE.isIonized, unit1);
            }

            const targetPos = preset.pos.clone();
            if (!STATE.dualMode && presetKey === 'shells') {
                if (def.key === 'h') targetPos.set(11.4, 10.6, 10.8);
                else if (def.key === 'cl' || def.key === 'na') targetPos.set(12.8, 11.8, 12.4);
            }

            camTransition.active = true;
            camTransition.startTime = performance.now();
            camTransition.duration = 950;
            camTransition.startPos.copy(camera.position);
            camTransition.endPos.copy(targetPos);
            camTransition.startTarget.copy(controls.target);
            camTransition.endTarget.copy(preset.target);
        }

        function toggleIonizationState() {
            const def = getActiveDef();
            STATE.isIonized = !STATE.isIonized;
            STATE.highlightedChapter = 4;

            const btn = document.getElementById('btn-ionize-action');
            const dot = document.getElementById('state-dot');

            if (STATE.isIonized) {
                btn.textContent = def.ionButtonIonized;
                dot.className = 'w-2.5 h-2.5 rounded-full bg-pink-500 flex-shrink-0 shadow-[0_0_8px_#ec4899]';
                setCaptionText(def.captions.ionizedActive);
            } else {
                btn.textContent = def.ionButtonNeutral;
                dot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-400 flex-shrink-0 shadow-[0_0_8px_#34d399]';
                setCaptionText(def.captions.overview);
            }

            renderLeftPageTexture(STATE.highlightedChapter, STATE.isIonized, unit1);
            renderRightPageTexture(STATE.isIonized, unit1);
        }

        function switchElement(elemKey) {
            if (!ELEMENT_DEFS[elemKey] || STATE.currentElement === elemKey) return;

            STATE.currentElement = elemKey;
            unit1.elementKey = elemKey;
            STATE.isIonized = false;
            STATE.ionizationProgress = 0;

            const def = getActiveDef();

            document.querySelectorAll('.elem-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.element === elemKey);
            });

            const ionBtn = document.getElementById('btn-ionize-action');
            const dot = document.getElementById('state-dot');
            ionBtn.textContent = def.ionButtonNeutral;
            dot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-400 flex-shrink-0 shadow-[0_0_8px_#34d399]';

            rebuildAtomModel(unit1);
            renderLeftPageTexture(STATE.highlightedChapter, false, unit1);
            renderRightPageTexture(false, unit1);
            setCaptionText(def.captions[STATE.currentCamPreset] || def.captions.overview);
        }

        function updateDualControlsUI() {
            const singleCtrl = document.getElementById('single-mode-controls');
            const dualCtrl = document.getElementById('dual-mode-controls');
            const dualToggleBtn = document.getElementById('btn-dual-mode');

            if (STATE.dualMode) {
                singleCtrl.classList.add('hidden');
                dualCtrl.classList.remove('hidden');
                dualToggleBtn.textContent = '📖 1冊にもどす';
            } else {
                singleCtrl.classList.remove('hidden');
                dualCtrl.classList.add('hidden');
                dualToggleBtn.textContent = '📚 2冊ならべる';
            }

            document.querySelectorAll('.dual-elem-btn').forEach(btn => {
                const side = btn.dataset.dualSide;
                const elem = btn.dataset.dualElem;
                const isActive = STATE.dualElements[side] === elem;
                btn.classList.toggle('active', isActive);
                btn.classList.toggle('bg-emerald-600', isActive);
                btn.classList.toggle('text-white', isActive);
                btn.classList.toggle('text-slate-300', !isActive);
            });

            const pairType = getDualReactionPair();
            const hclOk = pairType !== null;
            const btnSep = document.getElementById('btn-hcl-separate');
            const btnBond = document.getElementById('btn-hcl-bond');
            const btnIon = document.getElementById('btn-hcl-ionize');
            [btnSep, btnBond, btnIon].forEach(b => b.classList.remove('ring-2', 'ring-white'));

            if (pairType === 'nacl') {
                btnSep.textContent = '別々 (Na + Cl)';
                btnBond.textContent = '🔗 イオン結合 (NaCl)';
                btnIon.textContent = '⚡ 電離 (Na⁺ + Cl⁻)';
            } else {
                btnSep.textContent = '別々 (H + Cl)';
                btnBond.textContent = '🔗 共有結合 (HCl)';
                btnIon.textContent = '⚡ 電離 (H⁺ + Cl⁻)';
            }

            if (STATE.hclStage === 'separate') btnSep.classList.add('ring-2', 'ring-white');
            else if (STATE.hclStage === 'bonded') btnBond.classList.add('ring-2', 'ring-white');
            else if (STATE.hclStage === 'ionized') btnIon.classList.add('ring-2', 'ring-white');

            btnBond.style.opacity = hclOk ? '1' : '0.45';
            btnIon.style.opacity = hclOk ? '1' : '0.45';
        }

        function toggleDualMode() {
            STATE.dualMode = !STATE.dualMode;
            STATE.isIonized = false;
            STATE.ionizationProgress = 0;
            STATE.hclStage = 'separate';
            STATE.hclBondProgress = 0;
            STATE.hclIonizeProgress = 0;

            const dot = document.getElementById('state-dot');

            if (STATE.dualMode) {
                unit1.elementKey = STATE.dualElements.left;
                unit2.elementKey = STATE.dualElements.right;
                unit1.targetBookX = -DUAL_BOOK_OFFSET_X;
                unit2.targetBookX = DUAL_BOOK_OFFSET_X;
                unit2.bookGroup.visible = true;
                unit2.atomGroup.visible = true;
                unit1.targetAtomPos.copy(getUnitHomeAtomPos(unit1));
                unit2.targetAtomPos.copy(getUnitHomeAtomPos(unit2));

                rebuildAtomModel(unit1);
                rebuildAtomModel(unit2);
                renderLeftPageTexture(0, false, unit1);
                renderRightPageTexture(false, unit1);
                renderLeftPageTexture(0, false, unit2);
                renderRightPageTexture(false, unit2);

                dot.className = 'w-2.5 h-2.5 rounded-full bg-indigo-400 flex-shrink-0 shadow-[0_0_8px_#818cf8]';
                const pairType = getDualReactionPair();
                setCaptionText(pairType === 'nacl'
                    ? '2冊モード (Na と Cl) ： 「イオン結合 (NaCl)」や「電離 (Na⁺ + Cl⁻)」を押して反応を観察しよう！'
                    : pairType === 'hcl'
                        ? '2冊モード (H と Cl) ： 「共有結合 (HCl)」や「電離 (H⁺ + Cl⁻)」を押して反応を観察しよう！'
                        : '2冊モード ： 2つの原子を比較中（H と Cl、または Na と Cl を選ぶと結合・電離が見られます）');
                moveToCameraPreset('dualOverview');
            } else {
                unit1.elementKey = STATE.currentElement;
                unit1.targetBookX = 0;
                unit1.targetAtomPos.copy(getUnitHomeAtomPos(unit1));
                unit2.bookGroup.visible = false;
                unit2.atomGroup.visible = false;
                sharedBondGroup.visible = false;

                rebuildAtomModel(unit1);
                renderLeftPageTexture(0, false, unit1);
                renderRightPageTexture(false, unit1);

                const def = getActiveDef();
                document.getElementById('btn-ionize-action').textContent = def.ionButtonNeutral;
                dot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-400 flex-shrink-0 shadow-[0_0_8px_#34d399]';
                moveToCameraPreset('overview');
            }

            updateDualControlsUI();
        }

        function setDualElement(side, elemKey) {
            if (!ELEMENT_DEFS[elemKey]) return;
            STATE.dualElements[side] = elemKey;
            const unit = side === 'left' ? unit1 : unit2;
            unit.elementKey = elemKey;

            STATE.hclStage = 'separate';
            STATE.hclBondProgress = 0;
            STATE.hclIonizeProgress = 0;
            unit1.targetAtomPos.copy(getUnitHomeAtomPos(unit1));
            unit2.targetAtomPos.copy(getUnitHomeAtomPos(unit2));
            sharedBondGroup.visible = false;

            rebuildAtomModel(unit);
            renderLeftPageTexture(0, false, unit);
            renderRightPageTexture(false, unit);
            updateShellMaterialsAndVisibility();
            updateDualControlsUI();

            const pairType = getDualReactionPair();
            if (pairType === 'nacl') {
                setCaptionText('Na と Cl のペアが揃いました！ 「イオン結合 (NaCl)」または「電離 (Na⁺ + Cl⁻)」を押してみよう');
                moveToCameraPreset('dualOverview');
            } else if (pairType === 'hcl') {
                setCaptionText('H と Cl のペアが揃いました！ 「共有結合 (HCl)」または「電離 (H⁺ + Cl⁻)」を押してみよう');
                moveToCameraPreset('dualOverview');
            } else {
                setCaptionText(`左: ${ELEMENT_DEFS[unit1.elementKey].symbol} ／ 右: ${ELEMENT_DEFS[unit2.elementKey].symbol} を比較中（H と Cl、または Na と Cl を選ぶと結合・電離が見られます）`);
            }
        }

        function setHclStage(stage) {
            if (!STATE.dualMode) return;
            const pairType = getDualReactionPair();
            if (!pairType) {
                setCaptionText('結合・電離を見るには、左と右で「H と Cl」または「Na と Cl」を選んでください！');
                return;
            }

            STATE.hclStage = stage;
            const donorUnit = (unit1.elementKey === 'h' || unit1.elementKey === 'na') ? unit1 : unit2;
            const clUnit = donorUnit === unit1 ? unit2 : unit1;
            const donorSideSign = (donorUnit === unit1) ? -1 : 1;
            const dot = document.getElementById('state-dot');

            if (stage === 'separate') {
                unit1.targetAtomPos.copy(getUnitHomeAtomPos(unit1));
                unit2.targetAtomPos.copy(getUnitHomeAtomPos(unit2));
                dot.className = 'w-2.5 h-2.5 rounded-full bg-indigo-400 flex-shrink-0 shadow-[0_0_8px_#818cf8]';
                setCaptionText(pairType === 'nacl'
                    ? '反応前 (Na + Cl) ： ナトリウム原子(M殻 e⁻ 1) と 塩素原子(M殻 e⁻ 7) がそれぞれの教科書の上にあります'
                    : '反応前 (H + Cl) ： 水素原子(e⁻ 1) と 塩素原子(M殻 e⁻ 7) がそれぞれの教科書の上にあります');
                moveToCameraPreset('dualOverview');
            } else if (stage === 'bonded') {
                if (pairType === 'nacl') {
                    donorUnit.targetAtomPos.set(donorSideSign * 4.5, 9.0, 0);
                    clUnit.targetAtomPos.set(-donorSideSign * 4.5, 9.0, 0);
                    sharedBondGroup.position.set(0, 9.0, 0);
                    dot.className = 'w-2.5 h-2.5 rounded-full bg-amber-400 flex-shrink-0 shadow-[0_0_8px_#fbbf24]';
                    setCaptionText('🔗 イオン結合 (NaCl 塩化ナトリウム) ： NaのM殻電子1個がClへ移り、Na⁺とCl⁻が静電気力で結合！');
                } else {
                    donorUnit.targetAtomPos.set(donorSideSign * 3.3, 9.0, 0);
                    clUnit.targetAtomPos.set(-donorSideSign * 3.3, 9.0, 0);
                    sharedBondGroup.position.set(0, 9.0, 0);
                    dot.className = 'w-2.5 h-2.5 rounded-full bg-amber-400 flex-shrink-0 shadow-[0_0_8px_#fbbf24]';
                    setCaptionText('🔗 共有結合 (HCl 塩化水素) ： HとClが電子を1個ずつ出し合い、共有電子対をつくって安定！');
                }
                moveToCameraPreset('dualReaction');
            } else if (stage === 'ionized') {
                donorUnit.targetAtomPos.set(donorSideSign * 9.5, 9.0, 0);
                clUnit.targetAtomPos.set(-donorSideSign * 9.5, 9.0, 0);
                dot.className = 'w-2.5 h-2.5 rounded-full bg-pink-500 flex-shrink-0 shadow-[0_0_8px_#ec4899]';
                setCaptionText(pairType === 'nacl'
                    ? '⚡ 電離 (NaCl → Na⁺ + Cl⁻) ： 水に溶けると Na⁺ (陽イオン) と Cl⁻ (陰イオン) に分かれて移動します！'
                    : '⚡ 電離 (HCl → H⁺ + Cl⁻) ： 水中でHが電子をClに渡して H⁺ (陽イオン) と Cl⁻ (陰イオン) に分かれる！');
                moveToCameraPreset('dualReaction');
            }

            updateDualControlsUI();
        }

        // ============================================================================
        // 8. RAYCASTING INTERACTION & GROUND-PARALLEL VIEWPOINT MOVEMENT
        // ============================================================================
        const raycaster = new THREE.Raycaster();
        const pointerDownPos = new THREE.Vector2();
        const mouseNDC = new THREE.Vector2();
        const deskPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

        // Smart Drag Mode: Left-dragging on the Left Page slides parallel to the ground;
        // Left-dragging on the 3D Atom rotates the model (Right-drag always pans parallel to the ground)
        renderer.domElement.addEventListener('pointerdown', (e) => {
            pointerDownPos.set(e.clientX, e.clientY);

            if (e.button === 0) {
                mouseNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouseNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouseNDC, camera);

                const atomHits = raycaster.intersectObjects(interactivePickables, false);
                const visibleLeftSurfaces = STATE.dualMode ? [unit1.leftPageSurface, unit2.leftPageSurface] : [unit1.leftPageSurface];
                const leftHits = raycaster.intersectObjects(visibleLeftSurfaces, false);

                if (atomHits.length > 0) {
                    controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
                    controls.touches.ONE = THREE.TOUCH.ROTATE;
                } else if (leftHits.length > 0 || STATE.currentCamPreset === 'textbook') {
                    controls.mouseButtons.LEFT = THREE.MOUSE.PAN;
                    controls.touches.ONE = THREE.TOUCH.PAN;
                } else {
                    controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
                    controls.touches.ONE = THREE.TOUCH.ROTATE;
                }
            }
        }, true);

        // Smooth Zoom-to-Cursor: shifts strictly parallel to the ground (XZ plane)
        renderer.domElement.addEventListener('wheel', (e) => {
            mouseNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouseNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouseNDC, camera);

            const hitPoint = new THREE.Vector3();
            if (raycaster.ray.intersectPlane(deskPlane, hitPoint)) {
                const maxX = STATE.dualMode ? 32 : 16;
                hitPoint.x = THREE.MathUtils.clamp(hitPoint.x, -maxX, maxX);
                hitPoint.z = THREE.MathUtils.clamp(hitPoint.z, -10.5, 10.5);
                if (e.deltaY < 0) {
                    const shift = new THREE.Vector3().subVectors(hitPoint, controls.target).multiplyScalar(0.14);
                    shift.y = 0; // Strictly parallel to the ground
                    controls.target.add(shift);
                    camera.position.add(shift);
                }
            }
        }, { passive: true });

        // Keyboard (Arrow keys / WASD) for smooth ground-parallel (XZ plane) movement
        const pressedKeys = new Set();
        window.addEventListener('keydown', (e) => pressedKeys.add(e.key.toLowerCase()));
        window.addEventListener('keyup', (e) => pressedKeys.delete(e.key.toLowerCase()));

        function updateKeyboardPan(dt) {
            if (pressedKeys.size === 0) return;
            const panStep = 12.0 * dt;
            const forward = new THREE.Vector3();
            camera.getWorldDirection(forward);
            forward.y = 0; // Project onto horizontal ground plane
            if (forward.lengthSq() < 0.0001) forward.set(0, 0, -1);
            forward.normalize();
            const right = new THREE.Vector3().crossVectors(forward, camera.up).normalize();

            const move = new THREE.Vector3();
            if (pressedKeys.has('arrowleft') || pressedKeys.has('a')) move.addScaledVector(right, -panStep);
            if (pressedKeys.has('arrowright') || pressedKeys.has('d')) move.addScaledVector(right, panStep);
            if (pressedKeys.has('arrowup') || pressedKeys.has('w')) move.addScaledVector(forward, panStep);
            if (pressedKeys.has('arrowdown') || pressedKeys.has('s')) move.addScaledVector(forward, -panStep);

            if (move.lengthSq() > 0) {
                camTransition.active = false;
                camera.position.add(move);
                controls.target.add(move);
            }
        }

        renderer.domElement.addEventListener('pointerup', (e) => {
            const dragDist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
            if (dragDist > 6) return;

            mouseNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouseNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouseNDC, camera);

            // 1. Check 3D Atom Pickables (Protons, Neutrons, Electrons)
            const atomHits = raycaster.intersectObjects(interactivePickables, false);
            if (atomHits.length > 0) {
                const uData = atomHits[0].object.userData;
                if (uData) {
                    if (uData.caption) {
                        setCaptionText(uData.caption);
                    } else if (uData.title) {
                        setCaptionText(`${uData.title} ： ${uData.desc}`);
                    }
                    return;
                }
            }

            // 2. Check Left Textbook Page Click: glide viewpoint strictly parallel to the ground
            const visibleLeftSurfaces = STATE.dualMode ? [unit1.leftPageSurface, unit2.leftPageSurface] : [unit1.leftPageSurface];
            const pageHits = raycaster.intersectObjects(visibleLeftSurfaces, false);
            if (pageHits.length > 0 && pageHits[0].uv) {
                const clickedUnit = pageHits[0].object === unit2.leftPageSurface ? unit2 : unit1;
                const uv = pageHits[0].uv;
                const canvasY = (1 - uv.y) * clickedUnit.leftPageCanvas.height;
                const hitPt = pageHits[0].point;

                let clickedChapter = 1;
                if (canvasY >= 795 && canvasY <= 1285) {
                    clickedChapter = 2;
                } else if (canvasY >= 1315 && canvasY <= 1925) {
                    clickedChapter = 3;
                } else if (canvasY >= 1955 && canvasY <= 2530) {
                    clickedChapter = 4;
                }

                STATE.highlightedChapter = clickedChapter;
                renderLeftPageTexture(STATE.highlightedChapter, STATE.isIonized, clickedUnit);

                // Smoothly slide camera & target parallel to the ground (constant Y height)
                const deltaXZ = new THREE.Vector3(
                    hitPt.x - controls.target.x,
                    0,
                    THREE.MathUtils.clamp(hitPt.z, -7.5, 7.5) - controls.target.z
                );
                camTransition.active = true;
                camTransition.startTime = performance.now();
                camTransition.duration = 650;
                camTransition.startPos.copy(camera.position);
                camTransition.startTarget.copy(controls.target);
                camTransition.endTarget.copy(controls.target).add(deltaXZ);
                camTransition.endPos.copy(camera.position).add(deltaXZ);
            }
        });

        // ============================================================================
        // 9. DOM UI EVENT LISTENERS
        // ============================================================================
        document.querySelectorAll('.elem-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                switchElement(btn.dataset.element);
            });
        });

        document.querySelectorAll('.cam-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                moveToCameraPreset(btn.dataset.cam);
            });
        });

        document.getElementById('btn-ionize-action').addEventListener('click', () => {
            toggleIonizationState();
        });

        document.getElementById('btn-dual-mode').addEventListener('click', () => {
            toggleDualMode();
        });

        document.querySelectorAll('.dual-elem-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                setDualElement(btn.dataset.dualSide, btn.dataset.dualElem);
            });
        });

        document.getElementById('btn-hcl-separate').addEventListener('click', () => setHclStage('separate'));
        document.getElementById('btn-hcl-bond').addEventListener('click', () => setHclStage('bonded'));
        document.getElementById('btn-hcl-ionize').addEventListener('click', () => setHclStage('ionized'));

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ============================================================================
        // 10. ANIMATION LOOP (SMOOTH 3D SPHERICAL ELECTRON MOTION & CAMERA EASING)
        // ============================================================================
        let lastTime = performance.now();

        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const dt = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;

            updateKeyboardPan(dt);

            // 1. Smooth Camera Preset Interpolation
            if (camTransition.active) {
                const elapsed = now - camTransition.startTime;
                const progress = Math.min(elapsed / camTransition.duration, 1.0);
                const eased = easeInOutCubic(progress);

                camera.position.lerpVectors(camTransition.startPos, camTransition.endPos, eased);
                controls.target.lerpVectors(camTransition.startTarget, camTransition.endTarget, eased);

                if (progress >= 1.0) {
                    camTransition.active = false;
                }
            }

            controls.update();

            // 2. Smooth Ionization & Dual HCl Reaction Progress Animation
            const targetIon = STATE.isIonized ? 1.0 : 0.0;
            if (Math.abs(STATE.ionizationProgress - targetIon) > 0.001) {
                STATE.ionizationProgress += (targetIon - STATE.ionizationProgress) * Math.min(dt * 3.2, 1.0);
                updateShellMaterialsAndVisibility();
            } else {
                STATE.ionizationProgress = targetIon;
            }

            const hclActive = isHclPair();
            const targetBond = (STATE.dualMode && hclActive && STATE.hclStage === 'bonded') ? 1.0 : 0.0;
            const targetHclIon = (STATE.dualMode && hclActive && STATE.hclStage === 'ionized') ? 1.0 : 0.0;
            let reactionChanged = false;
            if (Math.abs(STATE.hclBondProgress - targetBond) > 0.001) {
                STATE.hclBondProgress += (targetBond - STATE.hclBondProgress) * Math.min(dt * 3.5, 1.0);
                reactionChanged = true;
            } else {
                STATE.hclBondProgress = targetBond;
            }
            if (Math.abs(STATE.hclIonizeProgress - targetHclIon) > 0.001) {
                STATE.hclIonizeProgress += (targetHclIon - STATE.hclIonizeProgress) * Math.min(dt * 3.5, 1.0);
                reactionChanged = true;
            } else {
                STATE.hclIonizeProgress = targetHclIon;
            }
            if (reactionChanged) {
                updateShellMaterialsAndVisibility();
            }

            // Smoothly position books & atoms
            const activeUnits = STATE.dualMode ? UNITS : [unit1];
            activeUnits.forEach(unit => {
                unit.bookGroup.position.x += (unit.targetBookX - unit.bookGroup.position.x) * Math.min(dt * 5.0, 1.0);
                unit.atomGroup.position.lerp(unit.targetAtomPos, Math.min(dt * 4.5, 1.0));
            });

            // Shared covalent bond glowing ring
            const timeSec = now * 0.001;
            if (STATE.dualMode && hclActive && STATE.hclBondProgress > 0.05) {
                sharedBondGroup.visible = true;
                sharedBondMat.opacity = 0.85 * Math.min(1, STATE.hclBondProgress);
                sharedBondRing.rotation.z += dt * 1.6;
                const pulse = 1.0 + Math.sin(timeSec * 4.0) * 0.06;
                sharedBondRing.scale.set(pulse, pulse, pulse);
            } else {
                sharedBondGroup.visible = false;
            }

            // 3. Dynamic 3D Atom Motion across active units
            const pairType = getDualReactionPair();
            const donorUnit = (STATE.dualMode && hclActive) ? ((unit1.elementKey === 'h' || unit1.elementKey === 'na') ? unit1 : unit2) : null;
            const clUnit = (STATE.dualMode && hclActive) ? (donorUnit === unit1 ? unit2 : unit1) : null;

            activeUnits.forEach(unit => {
                const def = ELEMENT_DEFS[unit.elementKey];

                // Subtle vibration of nucleons in the nucleus
                unit.nucleons.forEach(nMesh => {
                    const b = nMesh.userData.basePos;
                    const p = nMesh.userData.phase;
                    nMesh.position.set(
                        b.x + Math.sin(timeSec * 5.0 + p) * 0.022,
                        b.y + Math.cos(timeSec * 4.5 + p) * 0.022,
                        b.z + Math.sin(timeSec * 5.5 + p * 1.3) * 0.022
                    );
                });

                let clSharedPicked = false;

                // Smooth 3D spherical motion for every electron
                unit.allElectrons.forEach(eData => {
                    eData.phase += eData.angularSpeed * dt;
                    eData.precessionAngle += eData.precessionSpeed * dt;

                    // In HCl / NaCl dual mode, hide Cl's single-mode external gained electron
                    if (STATE.dualMode && hclActive && eData.isGainedElectron) {
                        eData.mesh.visible = false;
                        return;
                    }
                    eData.mesh.visible = true;

                    const cosP = Math.cos(eData.phase);
                    const sinP = Math.sin(eData.phase);
                    const wobble = Math.sin(eData.precessionAngle * 2.3) * 0.24;

                    const posOnSphere = new THREE.Vector3()
                        .addScaledVector(eData.uVec, cosP)
                        .addScaledVector(eData.vVec, sinP)
                        .addScaledVector(eData.orbitNormal, wobble)
                        .normalize()
                        .multiplyScalar(eData.baseRadius);

                    if (STATE.dualMode && hclActive) {
                        if (pairType === 'nacl') {
                            // NaCl Ionic Bond & Ionization: Na's M-shell electron (shellIdx 2) transfers into Cl's M-shell (radius 5.25)
                            const isNaDonorElectron = (unit === donorUnit && eData.shellIdx === 2);
                            const transferProg = Math.max(STATE.hclBondProgress, STATE.hclIonizeProgress);
                            if (isNaDonorElectron && transferProg > 0.001) {
                                const clOrbitOffset = new THREE.Vector3()
                                    .addScaledVector(eData.uVec, cosP)
                                    .addScaledVector(eData.vVec, sinP)
                                    .addScaledVector(eData.orbitNormal, wobble)
                                    .normalize()
                                    .multiplyScalar(5.25);
                                const targetLocal = clUnit.atomGroup.position.clone()
                                    .add(clOrbitOffset)
                                    .sub(unit.atomGroup.position);
                                posOnSphere.lerp(targetLocal, easeInOutCubic(transferProg));
                            }
                        } else {
                            // HCl Covalent Bond (H's electron + 1 Cl M-shell electron orbit in shared pair)
                            const isHShared = (unit === donorUnit && eData.shellIdx === 0);
                            let isClShared = false;
                            if (unit === clUnit && eData.shellIdx === 2 && !eData.isGainedElectron && !clSharedPicked) {
                                isClShared = true;
                                clSharedPicked = true;
                            }

                            if ((isHShared || isClShared) && STATE.hclBondProgress > 0.001) {
                                const angle = timeSec * 4.2 + (isHShared ? 0 : Math.PI);
                                const bondWorld = new THREE.Vector3(
                                    sharedBondGroup.position.x + Math.cos(angle) * 0.45,
                                    sharedBondGroup.position.y + Math.sin(angle) * 1.05,
                                    Math.sin(angle * 2.0) * 0.65
                                );
                                const bondLocal = bondWorld.sub(unit.atomGroup.position);
                                posOnSphere.lerp(bondLocal, easeInOutCubic(STATE.hclBondProgress));
                            }

                            // HCl Ionization: H's electron transfers into Cl's M-shell (radius 5.25)
                            if (isHShared && STATE.hclIonizeProgress > 0.001) {
                                const clOrbitOffset = new THREE.Vector3()
                                    .addScaledVector(eData.uVec, cosP)
                                    .addScaledVector(eData.vVec, sinP)
                                    .addScaledVector(eData.orbitNormal, wobble)
                                    .normalize()
                                    .multiplyScalar(5.25);
                                const targetLocal = clUnit.atomGroup.position.clone()
                                    .add(clOrbitOffset)
                                    .sub(unit.atomGroup.position);
                                posOnSphere.lerp(targetLocal, easeInOutCubic(STATE.hclIonizeProgress));
                            }
                        }
                    } else if (!STATE.dualMode) {
                        if (eData.isGainedElectron) {
                            const remainingDist = (1.0 - easeInOutCubic(STATE.ionizationProgress)) * def.ejectDistance;
                            posOnSphere.addScaledVector(eData.ejectDir, remainingDist);
                            if (eData.eMat) {
                                eData.eMat.opacity = 0.4 + STATE.ionizationProgress * 0.6;
                            }
                            eData.haloMat.opacity = 0.18 + STATE.ionizationProgress * 0.18;
                        } else if (def.ionMode !== 'gain' && eData.shellIdx === def.valenceShellIdx && STATE.ionizationProgress > 0.001) {
                            const ejectDist = easeInOutCubic(STATE.ionizationProgress) * def.ejectDistance;
                            posOnSphere.addScaledVector(eData.ejectDir, ejectDist);
                        }
                    }

                    eData.mesh.position.copy(posOnSphere);
                });
            });

            // 4. Project Minimal K/L/M/N Shell Badges
            update3DLabels();

            renderer.render(scene, camera);
        }

        window.onload = function () {
            animate();
        };
    </script>
</body>
</html>
