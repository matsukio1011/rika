<script>'use strict';

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const ions={h:{label:'H⁺',body:'H',charge:1,color:'#80efcf',fill:'#214c50'},cl:{label:'Cl⁻',body:'Cl',charge:-1,color:'#c4b0f7',fill:'#38314e'},na:{label:'Na⁺',body:'Na',charge:1,color:'#ffd17d',fill:'#43351d'},oh:{label:'OH⁻',body:'OH',charge:-1,color:'#8bcfff',fill:'#1d3d58'},so4:{label:'SO₄²⁻',body:'SO₄',charge:-2,color:'#c4b0f7',fill:'#38314e'},ba:{label:'Ba²⁺',body:'Ba',charge:2,color:'#ffd17d',fill:'#43351d'}};

const modes={

    const dot=electron(p.x,p.y,shell===outer||gained);
    diagram.append(dot);
    if(gained)hiddenDots.push(dot);
    if(gained||lost)transfers.push({x:cx+p.x,y:429+p.y});
   }
  });
  group.append(diagram,
   textAt(cx,615,shells.map((count,index)=>shellNames[index]+count).join('　'),26,'#ffdc9f'),
   textAt(cx,652,orbitals(shells),22,'#c8dff0'));
 }
 function reset(){
  model=examples[picker.value];started=null;animating=false;transfers=[];hiddenDots=[];
  get('Moving').replaceChildren();
  const after=[...model.shells];
  after[after.length-1]-=model.charge;
  const charge=Math.abs(model.charge), gains=model.charge<0, symbol=ionSymbol();
  drawDiagram('Atom',375,model.name+'原子 '+model.symbol,model.shells,false);
  drawDiagram('Ion',1225,model.ion+' '+symbol,after,true);
  get('Transfer').textContent='電子 '+charge+' 個を'+(gains?'受け取る':'失う');
  const electrons=(charge===1?'':charge)+'e⁻';
  get('Equation').textContent=gains?model.symbol+' ＋ '+electrons+' → '+symbol:model.symbol+' → '+symbol+' ＋ '+electrons;
  get('Balance').textContent='陽子数 − 電子数　 '+model.protons+' − '+(model.protons-model.charge)+' ＝ '+(gains?'−':'＋')+charge;
 }
 function play(){
  if(!active)return;
  reset();
  if(reduce)return;
  animating=true;
  hiddenDots.forEach(dot=>dot.setAttribute('visibility','hidden'));
  transfers.forEach(()=>get('Moving').append(electron(0,0,true)));
 }
 function tick(now){
  if(!animating)return;
  started??=now;
  const progress=Math.max(0,Math.min(1,(now-started)/1500));
  transfers.forEach((point,index)=>{
   const center={x:783+index*34,y:470};
   const from=model.charge<0?center:point,to=model.charge<0?point:center;
   const x=from.x+(to.x-from.x)*progress;
   const y=from.y+(to.y-from.y)*progress-46*Math.sin(Math.PI*progress);
   get('Moving').children[index].setAttribute('transform','translate('+x+' '+y+')');
  });
  if(progress===1){
   animating=false;hiddenDots.forEach(dot=>dot.setAttribute('visibility','visible'));
   get('Moving').replaceChildren();
  }
 }
 get('Play').addEventListener('click',play);
 get('Play').addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();play();}});
 picker.addEventListener('change',reset);
 reset();
 return {
  activate(value){
   active=value;scene.style.display=value?'':'none';
   get('Picker').hidden=!value;get('Tab').setAttribute('aria-pressed',String(value));
   reset();
   if(value){
    svg.setAttribute('aria-label','原子とイオンの電子配置、陽子数、電子数を比較する図');
    $('#labFooter').innerHTML='<span>円は電子殻を表す模式図です。電子が通る軌道を描いたものではありません。</span><span>金色の点：最外殻の電子</span>';
   }
  },
  reset,tick
 };
})();
$('#highTab').addEventListener('click',()=>chooseExperiment('high'));
$('#reset').addEventListener('click',()=>{if(experiment==='high')highLab.reset();});
function highFrame(now){highLab.tick(now);requestAnimationFrame(highFrame);}
requestAnimationFrame(highFrame);
</script></body></html>
