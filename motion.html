    }

    // 残像のスクリーン座標を登録するヘルパー
    function registerSlopeGhostHitBox(rampLeftX, rampLeftY, rad, localX, localY, radius, stripIndex, maxStripIndex) {
      const cosR = Math.cos(-rad);
      const sinR = Math.sin(-rad);
      const screenX = rampLeftX + localX * cosR - localY * sinR;
      const screenY = rampLeftY + localX * sinR + localY * cosR;
      ghostHitBoxes.push({
        modeType: 1,
        stripIndex,
        maxStripIndex,
        screenX,
        screenY,
        radius
      });
    }

    function registerFreeGhostHitBox(screenX, screenY, radius, stripIndex, maxStripIndex) {
      ghostHitBoxes.push({
        modeType: 2,
        stripIndex,
        maxStripIndex,
        screenX,
        screenY,
        radius
      });
    }

    // =========================================================
    // 1C. 斜面と自由落下の並べて同時表示
    // =========================================================
    function drawSideBySideStageAutoFit(pSlope, kSlope, pFree, kFree) {
      const rect = document.getElementById('simStage').getBoundingClientRect();
      const W = rect.width;
      const H = rect.height;
      const ctx = simCtx;
      ctx.clearRect(0, 0, W, H);

      const padTop = 80;
      const padBottom = 52;
      const floorY = H - padBottom;
      const availH = Math.max(130, floorY - padTop);

      const splitX = W * 0.64;
      const leftPadL = 55;
      const leftPadR = 55;
      const availWLeft = Math.max(180, splitX - leftPadL - leftPadR);

      const rad = pSlope.rad;
      const topApparatusPx = 96;
      const dps = pSlope.dotsPerStrip;

      const maxTravelByW = (availWLeft / Math.cos(rad)) - topApparatusPx;
      const maxTravelByH = ((availH - 25) / Math.sin(rad)) - topApparatusPx;
      const travelPx = Math.max(70, Math.min(maxTravelByW, maxTravelByH));

      const pxPerCm = travelPx / pSlope.floorDistCm;
      const heightPx = pSlope.heightCm * pxPerCm;
      const pointAY = floorY - heightPx;

      drawMetricGrid(ctx, W, H, leftPadL, floorY, pxPerCm);

      ctx.fillStyle = '#1e293b';
      ctx.fillRect(20, floorY, W - 40, 28);
      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(20, floorY);
      ctx.lineTo(W - 20, floorY);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(148, 163, 184, 0.2)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(splitX, padTop - 10);
      ctx.lineTo(splitX, floorY);
      ctx.stroke();
      ctx.setLineDash([]);

      // 左エリア：実験1（斜面）
      const rampLenPx = travelPx + topApparatusPx;
      const totalHorizPx = rampLenPx * Math.cos(rad);
      const rampLeftX = leftPadL + (availWLeft - totalHorizPx) * 0.45;
      const rampLeftY = floorY;
      const pointASlopeX = rampLeftX + travelPx * Math.cos(rad);

      const blockW = Math.max(32, Math.min(60, totalHorizPx * 0.12));
      ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 2;
      ctx.fillRect(pointASlopeX - blockW * 0.5, pointAY, blockW, floorY - pointAY);
      ctx.strokeRect(pointASlopeX - blockW * 0.5, pointAY, blockW, floorY - pointAY);

      const arcR = Math.min(75, travelPx * 0.28);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(rampLeftX, rampLeftY, arcR, -rad, 0);
      ctx.stroke();
      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 12px Consolas, sans-serif';
      ctx.fillText(`θ=${pSlope.angleDeg.toFixed(0)}°`, rampLeftX + arcR + 6, rampLeftY - 6);

      ctx.save();
      ctx.translate(rampLeftX, rampLeftY);
      ctx.rotate(-rad);

      ctx.fillStyle = '#334155';
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 2;
      ctx.fillRect(0, -10, rampLenPx, 10);
      ctx.strokeRect(0, -10, rampLenPx, 10);

      const cartLenPx = 48;
      const cartHalf = cartLenPx / 2;
      const startCenterX = travelPx + cartHalf;

      const timerX = travelPx + cartLenPx + 12;
      ctx.fillStyle = '#475569';
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 2;
      ctx.fillRect(timerX, -30, 38, 20);
      ctx.strokeRect(timerX, -30, 38, 20);

      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.arc(travelPx, -10, 4.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText('A', travelPx - 12, -16);

      if (document.getElementById('chkStrobe').checked && kSlope.d > 0) {
        const maxStrip = Math.floor(kSlope.d / dps);
        for (let s = 0; s <= maxStrip; s++) {
          const kg = getAtDot(s * dps, pSlope);
          const gx = startCenterX - kg.x * pxPerCm;
          const isHovered = state.hoveredGhost && state.hoveredGhost.modeType === 1 && state.hoveredGhost.stripIndex === s;
          const isPopup = state.popupGhost && state.popupGhost.modeType === 1 && state.popupGhost.stripIndex === s;
          drawCartOnSlope(ctx, gx, cartHalf, true, s, isHovered || isPopup);
          registerSlopeGhostHitBox(rampLeftX, rampLeftY, rad, gx, -26, 26, s, maxStrip);
        }
      }

      const cartCenterX = startCenterX - kSlope.x * pxPerCm;

      ctx.strokeStyle = '#f8fafc';
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(cartCenterX + cartHalf, -21);
      ctx.lineTo(timerX + 38, -21);
      ctx.stroke();

      const maxDotSlope = Math.floor(kSlope.d);
      for (let d = 0; d <= maxDotSlope; d++) {
        const kd = getAtDot(d, pSlope);
        const dotPos = cartCenterX + cartHalf + (kSlope.x - kd.x) * pxPerCm;
        if (dotPos <= timerX + 36) {
          const isCut = d % dps === 0;
          ctx.fillStyle = isCut ? '#ef4444' : '#090d16';
          ctx.beginPath();
          ctx.arc(dotPos, -21, isCut ? 2.4 : 1.6, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      drawCartOnSlope(ctx, cartCenterX, cartHalf, false, 0, false);

      if (document.getElementById('chkForces').checked) {
        drawSlopeForces(ctx, cartCenterX, rad);
      }

      ctx.restore();

      if (kSlope.hitFloor) {
        ctx.fillStyle = '#60a5fa';
        ctx.font = 'bold 13px sans-serif';
        ctx.fillText(`💥 床に到達！(v = ${pSlope.finalSpeed.toFixed(0)} cm/s, t = ${pSlope.maxTime.toFixed(2)} s)`, rampLeftX, floorY - 38);
      }

      // 右エリア：実験2（自由落下）
      const freeCenterX = splitX + (W - splitX) * 0.48;
      const vCartHalf = 22;
      const startCenterY = pointAY - vCartHalf;
      const topTimerY = startCenterY - vCartHalf - 18;

      const matW = 100;
      ctx.fillStyle = '#059669';
      ctx.strokeStyle = '#34d399';
      ctx.lineWidth = 2;
      ctx.fillRect(freeCenterX - matW / 2, floorY, matW, 10);
      ctx.strokeRect(freeCenterX - matW / 2, floorY, matW, 10);

      const pillarX = freeCenterX - 58;
      ctx.fillStyle = '#334155';
      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 2;
      ctx.fillRect(pillarX - 8, topTimerY - 12, 10, floorY - (topTimerY - 12));
      ctx.strokeRect(pillarX - 8, topTimerY - 12, 10, floorY - (topTimerY - 12));

      ctx.fillStyle = '#475569';
      ctx.fillRect(pillarX + 2, topTimerY - 5, 66, 9);
      ctx.fillRect(freeCenterX - 20, topTimerY - 15, 40, 26);
      ctx.strokeRect(freeCenterX - 20, topTimerY - 15, 40, 26);

      if (document.getElementById('chkStrobe').checked && kFree.d > 0) {
        const maxStrip = Math.floor(kFree.d / dps);
        for (let s = 0; s <= maxStrip; s++) {
          const kg = getAtDot(s * dps, pFree);
          const gy = startCenterY + kg.x * pxPerCm;
          const isHovered = state.hoveredGhost && state.hoveredGhost.modeType === 2 && state.hoveredGhost.stripIndex === s;
          const isPopup = state.popupGhost && state.popupGhost.modeType === 2 && state.popupGhost.stripIndex === s;
          drawVerticalCart(ctx, freeCenterX, gy, vCartHalf, true, s, kg.x, isHovered || isPopup);
          registerFreeGhostHitBox(freeCenterX, gy, 24, s, maxStrip);
        }
      }

      const curCenterY = startCenterY + kFree.x * pxPerCm;

      ctx.strokeStyle = '#f8fafc';
      ctx.lineWidth = 2.6;
      ctx.beginPath();
      ctx.moveTo(freeCenterX, topTimerY + 11);
      ctx.lineTo(freeCenterX, curCenterY - vCartHalf);
      ctx.stroke();

      const maxDotFree = Math.floor(kFree.d);
      for (let d = 0; d <= maxDotFree; d++) {
        const kd = getAtDot(d, pFree);
        const dotY = (curCenterY - vCartHalf) - (kFree.x - kd.x) * pxPerCm;
        if (dotY >= topTimerY + 11) {
          const isCut = d % dps === 0;
          ctx.fillStyle = isCut ? '#ef4444' : '#090d16';
          ctx.beginPath();
          ctx.arc(freeCenterX, dotY, isCut ? 2.6 : 1.7, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      drawVerticalCart(ctx, freeCenterX, curCenterY, vCartHalf, false, 0, kFree.x, false);

      if (document.getElementById('chkForces').checked) {
        drawVectorArrow(ctx, freeCenterX, curCenterY, freeCenterX, curCenterY + 72, '#ef4444', 3.4);
      }

      if (kFree.hitFloor) {
        ctx.fillStyle = '#fb923c';
        ctx.font = 'bold 13px sans-serif';
        ctx.fillText(`💥 床に到達！(v = ${pFree.finalSpeed.toFixed(0)} cm/s, t = ${pFree.maxTime.toFixed(2)} s)`, freeCenterX - 95, floorY - 12);
      }

      // 共通の高さガイド線
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 1.6;
      ctx.setLineDash([6, 4]);
      ctx.beginPath();
      ctx.moveTo(pointASlopeX, pointAY);
      ctx.lineTo(freeCenterX + 85, pointAY);
      ctx.stroke();
      ctx.setLineDash([]);

      const dimX = freeCenterX + 78;
      drawDoubleArrow(ctx, dimX, pointAY, dimX, floorY, '#fbbf24', 2.0);
      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 13px Consolas, sans-serif';
      ctx.fillText(`共通の高さ`, dimX + 8, (pointAY + floorY) / 2 - 7);
      ctx.fillText(`h = ${pSlope.heightCm.toFixed(0)} cm`, dimX + 8, (pointAY + floorY) / 2 + 11);
    }

    // =========================================================
    // 1A. 実験1：斜面＋水平面 単体表示（自動縮尺フィット）
    // =========================================================
    function drawSlopeStageAutoFit(phys, kin) {
      const rect = document.getElementById('simStage').getBoundingClientRect();
      const W = rect.width;
      const H = rect.height;
      const ctx = simCtx;
      ctx.clearRect(0, 0, W, H);

      const padTop = 78;
      const padBottom = 56;
      const padLeft = 75;
      const padRight = 135;
      const availW = Math.max(200, W - padLeft - padRight);
      const availH = Math.max(140, H - padTop - padBottom);

      const floorY = H - padBottom;
      const rad = phys.rad;
      const topApparatusPx = 108;
      const cartLenPx = 54;
      const cartHalf = cartLenPx / 2;
      const leftCartMarginPx = phys.flatLenCm > 0 ? cartLenPx + 16 : 20;
      const dps = phys.dotsPerStrip;

      // 斜面＋水平面の全体が画面にぴったり収まる pxPerCm を算出
      const horizCmTotal = phys.flatLenCm + phys.slopeDistCm * Math.cos(rad);
      const vertCmTotal = phys.slopeDistCm * Math.sin(rad);

      const pxPerCmW = (availW - leftCartMarginPx - topApparatusPx * Math.cos(rad)) / Math.max(10, horizCmTotal);
      const pxPerCmH = (availH - topApparatusPx * Math.sin(rad)) / Math.max(10, vertCmTotal);
      const pxPerCm = Math.max(0.15, Math.min(pxPerCmW, pxPerCmH));

      const slopeTravelPx = phys.slopeDistCm * pxPerCm;
      const rampLenPx = slopeTravelPx + topApparatusPx;
      const flatLenPx = phys.flatLenCm * pxPerCm;

      const totalHorizSlopePx = rampLenPx * Math.cos(rad);
      const totalDiagramW = leftCartMarginPx + flatLenPx + totalHorizSlopePx;

      const flatLeftX = padLeft + (availW - totalDiagramW) * 0.5 + leftCartMarginPx;
      const rampLeftX = flatLeftX + flatLenPx; // 斜面下端（B点・水平面との接続点）
      const rampLeftY = floorY;

      const pointAScreenX = rampLeftX + slopeTravelPx * Math.cos(rad);
      const pointAScreenY = rampLeftY - slopeTravelPx * Math.sin(rad);

      drawMetricGrid(ctx, W, H, rampLeftX, floorY, pxPerCm);

      // 床ベース
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(20, floorY, W - 40, 30);
      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(20, floorY);
      ctx.lineTo(W - 40, floorY);
      ctx.stroke();

      // 斜面の下に続く水平な平面の描画（前半 B〜C：μ₁ ／ 後半 C〜終端：μ₂）
      if (phys.flatLenCm > 0) {
        const flat1Px = phys.flat1LenCm * pxPerCm;
        const changeScreenX = rampLeftX - flat1Px; // C点（摩擦切替位置）
        const boardLeftEdgeX = flatLeftX - cartLenPx;

        // 区間描画ヘルパー（xLeft〜xRight の水平板＋摩擦ハッチング）
        const drawFlatZoneBoard = (xLeft, xRight, mu, strokeCol, fillBaseCol, hatchRgb) => {
          const w = xRight - xLeft;
          if (w <= 0.5) return;
          ctx.fillStyle = mu > 0 ? fillBaseCol : '#334155';
          ctx.strokeStyle = mu > 0 ? strokeCol : '#34d399';
          ctx.lineWidth = 2;
          ctx.fillRect(xLeft, floorY - 10, w, 10);
          ctx.strokeRect(xLeft, floorY - 10, w, 10);

          if (mu > 0) {
            ctx.save();
            ctx.beginPath();
            ctx.rect(xLeft, floorY - 10, w, 10);
            ctx.clip();
            const alpha = Math.min(0.88, 0.25 + mu * 1.15);
            ctx.strokeStyle = `rgba(${hatchRgb}, ${alpha})`;
            ctx.lineWidth = 1.6;
            const hatchStep = Math.max(5, 14 - mu * 16);
            for (let hx = xLeft - 12; hx < xLeft + w + 12; hx += hatchStep) {
              ctx.beginPath();
              ctx.moveTo(hx, floorY);
              ctx.lineTo(hx + 6, floorY - 10);
              ctx.stroke();
            }
            ctx.restore();
          }
        };

        // 後半区間（C点より左：boardLeftEdgeX 〜 changeScreenX, 摩擦係数 μ₂）
        drawFlatZoneBoard(
          boardLeftEdgeX,
          changeScreenX,
          phys.frictionMu2,
          '#fb923c',
          '#42282c',
          '251, 146, 60'
        );

        // 前半区間（B点〜C点：changeScreenX 〜 rampLeftX, 摩擦係数 μ₁）
        drawFlatZoneBoard(
          changeScreenX,
          rampLeftX,
          phys.frictionMu1,
          '#f472b6',
          '#3b2d3f',
          '244, 114, 182'
        );

        // 水平面の目盛り
        const flatTickStepCm = phys.flatLenCm > 200 ? 50 : phys.flatLenCm > 80 ? 20 : 10;
        for (let cm = 0; cm <= phys.flatLenCm; cm += flatTickStepCm) {
          const tx = rampLeftX - cm * pxPerCm;
          ctx.strokeStyle = cm === 0 ? '#34d399' : '#cbd5e1';
          ctx.lineWidth = 1.3;
          ctx.beginPath();
          ctx.moveTo(tx, floorY - 10);
          ctx.lineTo(tx, floorY - 2);
          ctx.stroke();
        }

        // B点（斜面下端・水平面始点）マーカー
        ctx.fillStyle = '#34d399';
        ctx.beginPath();
        ctx.arc(rampLeftX, floorY - 10, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText('B', rampLeftX - 4, floorY - 15);

        // C点（摩擦係数の切替位置）マーカー
        if (phys.flatChangeCm > 0 && phys.flatChangeCm < phys.flatLenCm) {
          ctx.strokeStyle = '#fb923c';
          ctx.lineWidth = 2;
          ctx.setLineDash([4, 2]);
          ctx.beginPath();
          ctx.moveTo(changeScreenX, floorY - 28);
          ctx.lineTo(changeScreenX, floorY + 12);
          ctx.stroke();
          ctx.setLineDash([]);

          ctx.fillStyle = '#fb923c';
          ctx.beginPath();
          ctx.arc(changeScreenX, floorY - 10, 4.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.font = 'bold 12px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(`C (${phys.flatChangeCm.toFixed(0)}cm)`, changeScreenX, floorY - 31);
          ctx.textAlign = 'left';
        }

        // 水平面の前半・後半の寸法と摩擦係数ラベル
        const flatDimY = floorY + 16;
        if (phys.flatChangeCm > 0 && phys.flatChangeCm < phys.flatLenCm) {
          // 前半 B〜C
          drawDoubleArrow(ctx, changeScreenX, flatDimY, rampLeftX, flatDimY, '#f472b6', 1.8);
          ctx.fillStyle = '#f472b6';
          ctx.font = 'bold 11.5px Consolas, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(
            `前半 ${phys.flat1LenCm.toFixed(0)}cm (μ₁=${phys.frictionMu1.toFixed(2)})`,
            (changeScreenX + rampLeftX) * 0.5,
            flatDimY + 14
          );

          // 後半 C〜終端
          drawDoubleArrow(ctx, flatLeftX, flatDimY, changeScreenX, flatDimY, '#fb923c', 1.8);
          ctx.fillStyle = '#fb923c';
          ctx.fillText(
            `後半 ${phys.flat2LenCm.toFixed(0)}cm (μ₂=${phys.frictionMu2.toFixed(2)})`,
            (flatLeftX + changeScreenX) * 0.5,
            flatDimY + 14
          );
          ctx.textAlign = 'left';
        } else {
          const singleMu = phys.flatChangeCm <= 0 ? phys.frictionMu2 : phys.frictionMu1;
          const col = singleMu > 0 ? '#f472b6' : '#34d399';
          drawDoubleArrow(ctx, flatLeftX, flatDimY, rampLeftX, flatDimY, col, 1.8);
          ctx.fillStyle = col;
          ctx.font = 'bold 12px Consolas, sans-serif';
          ctx.textAlign = 'center';
          const muTxt = singleMu > 0 ? `摩擦係数 μ = ${singleMu.toFixed(2)}` : `摩擦なし (μ = 0.00)`;
          ctx.fillText(
            `水平面 ${phys.flatLenCm.toFixed(0)} cm （${muTxt}）`,
            (flatLeftX + rampLeftX) * 0.5,
            flatDimY + 15
          );
          ctx.textAlign = 'left';
        }
      }

      // 斜面を支える支柱ブロック
      const blockW = Math.max(36, Math.min(70, totalHorizSlopePx * 0.12));
      const blockX = pointAScreenX - blockW * 0.5;
      ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 2;
      ctx.fillRect(blockX, pointAScreenY, blockW, floorY - pointAScreenY);
      ctx.strokeRect(blockX, pointAScreenY, blockW, floorY - pointAScreenY);

      // A点の高さ寸法線
      const dimX = pointAScreenX + 42;
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 3]);
      ctx.beginPath();
      ctx.moveTo(pointAScreenX, pointAScreenY);
      ctx.lineTo(dimX + 8, pointAScreenY);
      ctx.stroke();
      ctx.setLineDash([]);

      drawDoubleArrow(ctx, dimX, pointAScreenY, dimX, floorY, '#fbbf24', 2.2);
      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 13px Consolas, sans-serif';
      ctx.fillText(`A点の高さ`, dimX + 10, (pointAScreenY + floorY) / 2 - 8);
      ctx.font = 'bold 15px Consolas, sans-serif';
      ctx.fillText(`h = ${phys.heightCm.toFixed(0)} cm`, dimX + 10, (pointAScreenY + floorY) / 2 + 12);

      // 斜面角度アーク
      const arcR = Math.min(85, slopeTravelPx * 0.28);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(rampLeftX, rampLeftY, arcR, -rad, 0);
      ctx.stroke();
      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 13px Consolas, sans-serif';
      ctx.fillText(`θ = ${phys.angleDeg.toFixed(0)}°`, rampLeftX + arcR + 8, rampLeftY - 8);

      // --- 斜面座標系での描画 ---
      ctx.save();
      ctx.translate(rampLeftX, rampLeftY);
      ctx.rotate(-rad);

      ctx.fillStyle = '#334155';
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 2;
      ctx.fillRect(0, -10, rampLenPx, 10);
      ctx.strokeRect(0, -10, rampLenPx, 10);

      const tickStepCm = phys.slopeDistCm > 300 ? 50 : phys.slopeDistCm > 120 ? 20 : 10;
      for (let cm = 0; cm <= phys.slopeDistCm; cm += tickStepCm) {
        const tx = slopeTravelPx - cm * pxPerCm;
        ctx.strokeStyle = cm === 0 ? '#f97316' : '#cbd5e1';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(tx, -10);
        ctx.lineTo(tx, -2);
        ctx.stroke();
      }

      ctx.fillStyle = '#94a3b8';
      ctx.font = 'bold 12px Consolas, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`斜面距離 L₁ = ${phys.slopeDistCm.toFixed(1)} cm`, slopeTravelPx * 0.5, 18);
      ctx.textAlign = 'left';

      const startCenterX = slopeTravelPx + cartHalf;

      const timerX = slopeTravelPx + cartLenPx + 14;
      ctx.fillStyle = '#475569';
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 2;
      ctx.fillRect(timerX, -32, 42, 22);
      ctx.strokeRect(timerX, -32, 42, 22);

      const hammerOsc = state.playing ? Math.sin(state.currentDot * Math.PI * 2) * 3.5 : 0;
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(timerX + 16, -44 + hammerOsc, 8, 14);
      ctx.fillRect(timerX + 10, -48 + hammerOsc, 20, 4);

      ctx.fillStyle = '#f97316';
      ctx.beginPath();
      ctx.arc(slopeTravelPx, -10, 4.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText('A', slopeTravelPx - 12, -18);

      // 残像のうち「斜面上にあるもの」を描画
      if (document.getElementById('chkStrobe').checked && kin.d > 0) {
        const maxStrip = Math.floor(kin.d / dps);
        for (let s = 0; s <= maxStrip; s++) {
          const kGhost = getAtDot(s * dps, phys);
          if (!kGhost.onFlat) {
            const gx = startCenterX - kGhost.x * pxPerCm;
            const isHovered = state.hoveredGhost && state.hoveredGhost.modeType === 1 && state.hoveredGhost.stripIndex === s;
            const isPopup = state.popupGhost && state.popupGhost.modeType === 1 && state.popupGhost.stripIndex === s;
            drawCartOnSlope(ctx, gx, cartHalf, true, s, isHovered || isPopup);
            registerSlopeGhostHitBox(rampLeftX, rampLeftY, rad, gx, -26, 28, s, maxStrip);
          }
        }
      }

      // 記録テープの斜面区間を描画
      const slopeTapeStartLocalX = kin.onFlat ? 0 : (startCenterX - kin.x * pxPerCm + cartHalf);
      ctx.strokeStyle = '#f8fafc';
      ctx.lineWidth = 2.6;
      ctx.beginPath();
      ctx.moveTo(slopeTapeStartLocalX, -23);
      ctx.lineTo(timerX + 42, -23);
      ctx.stroke();

      // 斜面区間にある打点を描画
      const maxDotInt = Math.floor(kin.d);
      const flatDistNowCm = Math.max(0, kin.x - phys.slopeDistCm);
      for (let d = 0; d <= maxDotInt; d++) {
        const kd = getAtDot(d, phys);
        const distFromCartCm = kin.x - kd.x;
        if (distFromCartCm >= flatDistNowCm) {
          const distUpSlopeCm = distFromCartCm - flatDistNowCm;
          const dotPosOnRamp = (kin.onFlat ? 0 : (startCenterX - kin.x * pxPerCm + cartHalf)) + distUpSlopeCm * pxPerCm;
          if (dotPosOnRamp <= timerX + 40) {
            const isCut = d % dps === 0;
            ctx.fillStyle = isCut ? '#ef4444' : '#090d16';
            ctx.beginPath();
            ctx.arc(dotPosOnRamp, -23, isCut ? 2.6 : 1.7, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      // 台車が斜面上にいる場合の描画
      if (!kin.onFlat) {
        const cartCenterX = startCenterX - kin.x * pxPerCm;
        drawCartOnSlope(ctx, cartCenterX, cartHalf, false, 0, false);
        if (document.getElementById('chkForces').checked) {
          drawSlopeForces(ctx, cartCenterX, rad);
        }
      }

      ctx.restore();

      // --- 水平面座標系での残像・テープ・台車・力の描画 ---
      ctx.save();
      ctx.translate(rampLeftX, rampLeftY);

      if (document.getElementById('chkStrobe').checked && kin.d > 0) {
        const maxStrip = Math.floor(kin.d / dps);
        for (let s = 0; s <= maxStrip; s++) {
          const kGhost = getAtDot(s * dps, phys);
          if (kGhost.onFlat) {
            const flatGhostPx = (kGhost.x - phys.slopeDistCm) * pxPerCm;
            const gx = -flatGhostPx - cartHalf;
            const isHovered = state.hoveredGhost && state.hoveredGhost.modeType === 1 && state.hoveredGhost.stripIndex === s;
            const isPopup = state.popupGhost && state.popupGhost.modeType === 1 && state.popupGhost.stripIndex === s;
            drawCartOnSlope(ctx, gx, cartHalf, true, s, isHovered || isPopup);
            registerSlopeGhostHitBox(rampLeftX, rampLeftY, 0, gx, -26, 28, s, maxStrip);
          }
        }
      }

      if (kin.onFlat) {
        const flatTravelNowPx = (kin.x - phys.slopeDistCm) * pxPerCm;
        const cartCenterFlatX = -flatTravelNowPx - cartHalf;

        // 水平面区間の記録テープ
        ctx.strokeStyle = '#f8fafc';
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        ctx.moveTo(cartCenterFlatX + cartHalf, -23);
        ctx.lineTo(0, -23);
        ctx.stroke();

        // 水平面区間にある打点を描画
        for (let d = 0; d <= maxDotInt; d++) {
          const kd = getAtDot(d, phys);
          const distFromCartCm = kin.x - kd.x;
          if (distFromCartCm <= flatDistNowCm) {
            const dotFlatX = (cartCenterFlatX + cartHalf) + distFromCartCm * pxPerCm;
            const isCut = d % dps === 0;
            ctx.fillStyle = isCut ? '#ef4444' : '#090d16';
            ctx.beginPath();
            ctx.arc(dotFlatX, -23, isCut ? 2.6 : 1.7, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        drawCartOnSlope(ctx, cartCenterFlatX, cartHalf, false, 0, false);

        if (document.getElementById('chkForces').checked) {
          drawFlatForces(ctx, cartCenterFlatX, kin.currentMu ?? 0, kin.v);
        }
      }

      ctx.restore();

      if (kin.hitFloor) {
        ctx.fillStyle = '#fbbf24';
        ctx.font = 'bold 14px sans-serif';
        const endMsg = (phys.flatLenCm > 0 && phys.stopsOnFlat)
          ? `🛑 摩擦により水平面上で停止！（水平面の走行距離 ${phys.flatTravelCm.toFixed(1)} cm） ※残像①〜をクリックすると力の図を表示`
          : `💥 終端に到達！（終端速度 v = ${phys.finalSpeed.toFixed(1)} cm/s） ※残像①〜をクリックすると力の図を表示`;
        ctx.fillText(endMsg, Math.max(24, flatLeftX - 20), floorY - 42);
      }
    }

    // =========================================================
    // 1B. 実験2：自由落下単体表示（自動縮尺フィット）
    // =========================================================
    function drawFreeFallStageAutoFit(phys, kin) {
      const rect = document.getElementById('simStage').getBoundingClientRect();
      const W = rect.width;
      const H = rect.height;
      const ctx = simCtx;
      ctx.clearRect(0, 0, W, H);

      const padTop = 82;
      const padBottom = 52;
      const floorY = H - padBottom;
      const centerX = W * 0.5;
      const dps = phys.dotsPerStrip;

      const matH = 12;
      const matTopY = floorY - matH;
      const cartHalfLen = 26;
      const topTimerMarginPx = 68;

      const availFallPx = Math.max(90, (matTopY - padTop) - topTimerMarginPx);
      const pxPerCm = availFallPx / phys.heightCm;

      const startTipY = matTopY - availFallPx;
      const startCenterY = startTipY - cartHalfLen;
      const topTimerY = startCenterY - cartHalfLen - 22;

      drawMetricGrid(ctx, W, H, centerX - 180, matTopY, pxPerCm);

      ctx.fillStyle = '#1e293b';
      ctx.fillRect(30, floorY, W - 60, 28);
      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(30, floorY);
      ctx.lineTo(W - 30, floorY);
      ctx.stroke();

      const matW = 120;
      ctx.fillStyle = '#059669';
      ctx.strokeStyle = '#34d399';
      ctx.lineWidth = 2;
      ctx.fillRect(centerX - matW / 2, matTopY, matW, matH);
      ctx.strokeRect(centerX - matW / 2, matTopY, matW, matH);

      const pillarX = centerX - 68;
      ctx.fillStyle = '#334155';
      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 2;
      ctx.fillRect(pillarX - 8, topTimerY - 14, 12, floorY - (topTimerY - 14));
      ctx.strokeRect(pillarX - 8, topTimerY - 14, 12, floorY - (topTimerY - 14));

      ctx.fillStyle = '#475569';
      ctx.fillRect(pillarX + 4, topTimerY - 6, 76, 10);
      ctx.strokeRect(pillarX + 4, topTimerY - 6, 76, 10);

      ctx.fillStyle = '#475569';
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 2;
      ctx.fillRect(centerX - 24, topTimerY - 18, 48, 30);
      ctx.strokeRect(centerX - 24, topTimerY - 18, 48, 30);

      const hammerOsc = state.playing ? Math.sin(state.currentDot * Math.PI * 2) * 3.5 : 0;
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(centerX - 36 + hammerOsc, topTimerY - 6, 14, 6);

      const dimX = centerX + 115;
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 1.4;
      ctx.setLineDash([4, 3]);
      ctx.beginPath();
      ctx.moveTo(centerX, startTipY);
      ctx.lineTo(dimX + 8, startTipY);
      ctx.stroke();
      ctx.setLineDash([]);

      drawDoubleArrow(ctx, dimX, startTipY, dimX, matTopY, '#fbbf24', 2.2);
      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 14px Consolas, sans-serif';
      ctx.fillText(`A点の高さ h = ${formatHeight(phys.heightCm)}`, dimX + 12, (startTipY + matTopY) / 2 + 5);

      const stepCm = phys.heightCm > 1000 ? 200 : phys.heightCm > 400 ? 100 : phys.heightCm > 180 ? 50 : phys.heightCm > 120 ? 25 : phys.heightCm > 50 ? 10 : 5;
      for (let cm = 0; cm <= phys.heightCm + 0.01; cm += stepCm) {
        const yTick = startTipY + cm * pxPerCm;
        ctx.strokeStyle = '#64748b';
        ctx.lineWidth = 1.3;
        ctx.beginPath();
        ctx.moveTo(pillarX + 4, yTick);
        ctx.lineTo(pillarX + 15, yTick);
        ctx.stroke();

        ctx.fillStyle = '#94a3b8';
        ctx.font = '11px Consolas, monospace';
        ctx.textAlign = 'right';
        const tickLabel = isFreeMeterMode()
          ? `${+(cm / 100).toFixed(2)}m`
          : `${cm}cm`;
        ctx.fillText(tickLabel, pillarX - 12, yTick + 4);
      }
      ctx.textAlign = 'left';

      ctx.fillStyle = '#f97316';
      ctx.beginPath();
      ctx.arc(centerX - 34, startTipY, 4.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText('A点', centerX - 62, startTipY + 4);

      if (document.getElementById('chkStrobe').checked && kin.d > 0) {
        const maxStrip = Math.floor(kin.d / dps);
        for (let s = 0; s <= maxStrip; s++) {
          const kGhost = getAtDot(s * dps, phys);
          const gy = startCenterY + kGhost.x * pxPerCm;
          const isHovered = state.hoveredGhost && state.hoveredGhost.modeType === 2 && state.hoveredGhost.stripIndex === s;
          const isPopup = state.popupGhost && state.popupGhost.modeType === 2 && state.popupGhost.stripIndex === s;
          drawVerticalCart(ctx, centerX, gy, cartHalfLen, true, s, kGhost.x, isHovered || isPopup);
          registerFreeGhostHitBox(centerX, gy, 26, s, maxStrip);
        }
      }

      const curCenterY = startCenterY + kin.x * pxPerCm;

      ctx.strokeStyle = '#f8fafc';
      ctx.lineWidth = 2.8;
      ctx.beginPath();
      ctx.moveTo(centerX, topTimerY + 12);
      ctx.lineTo(centerX, curCenterY - cartHalfLen);
      ctx.stroke();

      const maxDotInt = Math.floor(kin.d);
      for (let d = 0; d <= maxDotInt; d++) {
        const kd = getAtDot(d, phys);
        const distFromCart = kin.x - kd.x;
        const dotY = (curCenterY - cartHalfLen) - distFromCart * pxPerCm;
        if (dotY >= topTimerY + 12) {
          const isCut = d % dps === 0;
          ctx.fillStyle = isCut ? '#ef4444' : '#090d16';
          ctx.beginPath();
          ctx.arc(centerX, dotY, isCut ? 2.8 : 1.9, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      drawVerticalCart(ctx, centerX, curCenterY, cartHalfLen, false, 0, kin.x, false);

      if (document.getElementById('chkForces').checked) {
        drawVectorArrow(ctx, centerX, curCenterY, centerX, curCenterY + 76, '#ef4444', 3.6);
        ctx.fillStyle = '#f87171';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText('重力 (100%)', centerX + 22, curCenterY + 46);
      }

      if (kin.hitFloor) {
        ctx.fillStyle = '#fbbf24';
        ctx.font = 'bold 14px sans-serif';
        ctx.fillText(`💥 床に到達！（終端速度 v = ${phys.finalSpeed.toFixed(1)} cm/s）`, centerX - 240, matTopY - 12);
      }
    }

    function drawMetricGrid(ctx, W, H, originX, originY, pxPerCm) {
      let gridCm = 10;
      if (pxPerCm * 10 > 85) gridCm = 5;
      if (pxPerCm * 10 < 22) gridCm = 25;
      if (pxPerCm * 25 < 22) gridCm = 50;
      if (pxPerCm * 50 < 22) gridCm = 100;
      if (pxPerCm * 100 < 22) gridCm = 200;
      if (pxPerCm * 200 < 22) gridCm = 500;

      const stepPx = gridCm * pxPerCm;
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.08)';
      ctx.lineWidth = 1;

      for (let x = originX % stepPx; x < W; x += stepPx) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      }
      for (let y = originY % stepPx; y < H; y += stepPx) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }

      const barX = W - 140;
      const barY = H - 16;
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(barX, barY);
      ctx.lineTo(barX + stepPx, barY);
      ctx.moveTo(barX, barY - 4);
      ctx.lineTo(barX, barY + 4);
      ctx.moveTo(barX + stepPx, barY - 4);
      ctx.lineTo(barX + stepPx, barY + 4);
      ctx.stroke();

      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 11px Consolas, sans-serif';
      const scaleTxt = isFreeMeterMode() ? `${+(gridCm / 100).toFixed(2)} m` : `${gridCm} cm`;
      ctx.fillText(`縮尺: ${scaleTxt}`, barX, barY - 7);
    }

    function drawDoubleArrow(ctx, x1, y1, x2, y2, color, width) {
      drawVectorArrow(ctx, (x1 + x2) / 2, (y1 + y2) / 2, x2, y2, color, width);
      drawVectorArrow(ctx, (x1 + x2) / 2, (y1 + y2) / 2, x1, y1, color, width);
    }

    function drawCartOnSlope(ctx, cx, halfLen, isGhost, stripNum, isHighlighted) {
      ctx.save();
      ctx.globalAlpha = isGhost ? (isHighlighted ? 0.85 : 0.32) : 1.0;

      ctx.fillStyle = '#cbd5e1';
      ctx.beginPath();
      ctx.arc(cx - halfLen + 10, -15, 5, 0, Math.PI * 2);
      ctx.arc(cx + halfLen - 10, -15, 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = isGhost ? (isHighlighted ? '#fde047' : '#38bdf8') : '#2563eb';
      ctx.strokeStyle = isHighlighted ? '#facc15' : '#93c5fd';
      ctx.lineWidth = isHighlighted ? 2.8 : 2;
      ctx.fillRect(cx - halfLen, -34, halfLen * 2, 16);
      ctx.strokeRect(cx - halfLen, -34, halfLen * 2, 16);

      if (isGhost && stripNum > 0) {
        ctx.globalAlpha = 0.95;
        ctx.fillStyle = isHighlighted ? '#fde047' : '#38bdf8';
        ctx.font = 'bold 11px sans-serif';
        ctx.fillText(CIRCLED_NUMS[stripNum] || `(${stripNum})`, cx - 6, -40);
      } else if (!isGhost) {
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 11px sans-serif';
        ctx.fillText('台車', cx - 12, -22);
      }
      ctx.restore();
    }

    function drawVerticalCart(ctx, cx, cy, halfLen, isGhost, stripNum, distCm, isHighlighted) {
      ctx.save();
      ctx.globalAlpha = isGhost ? (isHighlighted ? 0.88 : 0.32) : 1.0;

      ctx.fillStyle = '#cbd5e1';
      ctx.beginPath();
      ctx.arc(cx - 13, cy - 12, 4.5, 0, Math.PI * 2);
      ctx.arc(cx - 13, cy + 12, 4.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = isGhost ? (isHighlighted ? '#fde047' : '#fb923c') : '#ea580c';
      ctx.strokeStyle = isHighlighted ? '#facc15' : '#fed7aa';
      ctx.lineWidth = isHighlighted ? 2.8 : 2;
      ctx.fillRect(cx - 10, cy - halfLen, 20, halfLen * 2);
      ctx.strokeRect(cx - 10, cy - halfLen, 20, halfLen * 2);

      if (isGhost && stripNum > 0) {
        ctx.globalAlpha = 0.95;
        ctx.fillStyle = isHighlighted ? '#fde047' : '#fdba74';
        ctx.font = 'bold 11px Consolas, sans-serif';
        const dTxt = isFreeMeterMode()
          ? `${(distCm / 100).toFixed(2)}m`
          : `${distCm.toFixed(1)}cm`;
        ctx.fillText(`${CIRCLED_NUMS[stripNum] || stripNum} (${dTxt})`, cx + 16, cy + halfLen);
      }
      ctx.restore();
    }

    function drawSlopeForces(ctx, cartX, rad) {
      const cx = cartX;
      const cy = -26;
      const mgLen = 72;
      const fParallel = mgLen * Math.sin(rad);
      const fPerp = mgLen * Math.cos(rad);

      ctx.save();
      ctx.translate(cx, cy);

      ctx.strokeStyle = 'rgba(203, 213, 225, 0.45)';
      ctx.lineWidth = 1.2;
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.moveTo(-fParallel, 0);
      ctx.lineTo(-fParallel, fPerp);
      ctx.lineTo(0, fPerp);
      ctx.stroke();
      ctx.setLineDash([]);

      drawVectorArrow(ctx, 0, 0, -fParallel, fPerp, '#94a3b8', 2.2);
      drawVectorArrow(ctx, 0, 0, 0, fPerp, '#38bdf8', 2.0);
      drawVectorArrow(ctx, 0, 0, -fParallel, 0, '#ef4444', 3.2);

      ctx.restore();
    }

    function drawFlatForces(ctx, cartX, frictionMu, speed) {
      const cx = cartX;
      const cy = -26;
      const mgLen = 62;

      ctx.save();
      ctx.translate(cx, cy);

      // 垂直抗力（上向き）と重力（下向き）
      drawVectorArrow(ctx, 0, 0, 0, -mgLen, '#10b981', 2.4);
      drawVectorArrow(ctx, 0, 0, 0, mgLen, '#94a3b8', 2.4);

      // 動摩擦力（運動と逆向き＝右向き）
      if (frictionMu > 0 && speed > 0.5) {
        const fFric = Math.max(16, mgLen * frictionMu);
        drawVectorArrow(ctx, 0, 0, fFric, 0, '#ef4444', 3.4);
      }

      ctx.restore();
    }

    function drawVectorArrow(ctx, x1, y1, x2, y2, color, width) {
      const head = 8;
      const ang = Math.atan2(y2 - y1, x2 - x1);
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = width;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - head * Math.cos(ang - Math.PI / 6), y2 - head * Math.sin(ang - Math.PI / 6));
      ctx.lineTo(x2 - head * Math.cos(ang + Math.PI / 6), y2 - head * Math.sin(ang + Math.PI / 6));
      ctx.closePath();
      ctx.fill();
    }

    // =========================================================
    // 2. 記録テープ表示
    // =========================================================
    function drawSingleTapeStage(phys, kin) {
      const rect = document.getElementById('tapeStage').getBoundingClientRect();
      const W = rect.width;
      const H = rect.height;
      const ctx = tapeCtx;
      ctx.clearRect(0, 0, W, H);

      const circled = CIRCLED_NUMS.slice(1);
      const dps = phys.dotsPerStrip;

      const zoomY = 10;
      const zoomH = 42;
      const headX = W - 125;
      const zoomPxPerCm = phys.mode === 2 ? 7.0 : 11.5;

      ctx.fillStyle = '#0f172a';
      ctx.fillRect(16, zoomY, W - 32, zoomH);
      ctx.strokeStyle = '#1e293b';
      ctx.strokeRect(16, zoomY, W - 32, zoomH);

      const pulledPx = kin.x * zoomPxPerCm;
      const tapeLeftX = Math.max(20, headX - pulledPx);

      ctx.save();
      ctx.beginPath();
      ctx.rect(18, zoomY, W - 36, zoomH);
      ctx.clip();

      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(tapeLeftX, zoomY + 7, (W - 20) - tapeLeftX, zoomH - 14);
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(tapeLeftX, zoomY + 7, (W - 20) - tapeLeftX, zoomH - 14);

      const dotInt = Math.floor(kin.d);
      for (let d = 0; d <= dotInt; d++) {
        const kd = getAtDot(d, phys);
        const dx = headX - (kin.x - kd.x) * zoomPxPerCm;
        if (dx >= 18 && dx <= headX + 5) {
          const isCut = d % dps === 0;
          if (isCut) {
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([3, 2]);
            ctx.beginPath();
            ctx.moveTo(dx, zoomY + 5);
            ctx.lineTo(dx, zoomY + zoomH - 5);
            ctx.stroke();
            ctx.setLineDash([]);
          }
          ctx.fillStyle = isCut ? '#ef4444' : '#090d16';
          ctx.beginPath();
          ctx.arc(dx, zoomY + zoomH / 2, isCut ? 3.8 : 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      ctx.fillStyle = '#ef4444';
      ctx.fillRect(headX - 5, zoomY + 1, 10, 8);
      ctx.fillStyle = '#fca5a5';
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(`◀ ${phys.timerHz}Hz 打点ヘッド`, headX + 10, zoomY + zoomH / 2 + 4);
      ctx.restore();

      const fullY = 78;
      const fullH = 40;
      const padL = 24;
      const padR = 24;
      const usableW = W - padL - padR;
      const maxScaleCm = phys.floorDistCm * 1.03;
      const pxPerCm = usableW / maxScaleCm;

      drawFullTapeTrack(ctx, phys, kin, padL, fullY, fullH, pxPerCm, circled, true, W - padR);
    }

    function drawDualTapeStage(pSlope, kSlope, pFree, kFree) {
      const rect = document.getElementById('tapeStage').getBoundingClientRect();
      const W = rect.width;
      const H = rect.height;
      const ctx = tapeCtx;
      ctx.clearRect(0, 0, W, H);

      const circled = CIRCLED_NUMS.slice(1);
      const padL = 115;
      const padR = 24;
      const usableW = W - padL - padR;

      const maxScaleCm = Math.max(pSlope.floorDistCm, pFree.floorDistCm) * 1.03;
      const pxPerCm = usableW / maxScaleCm;

      ctx.fillStyle = '#60a5fa';
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(`📘 実験1：斜面`, 14, 34);
      ctx.fillStyle = '#94a3b8';
      ctx.font = '11px Consolas, sans-serif';
      ctx.fillText(`(${pSlope.timerHz}Hz, ${pSlope.angleDeg.toFixed(0)}°)`, 14, 50);

      drawFullTapeTrack(ctx, pSlope, kSlope, padL, 18, 34, pxPerCm, circled, false, W - padR);

      ctx.fillStyle = '#fb923c';
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(`📙 実験2：自由落下`, 14, 102);
      ctx.fillStyle = '#94a3b8';
      ctx.font = '11px Consolas, sans-serif';
      ctx.fillText(`(${pFree.timerHz}Hz, 90°)`, 14, 118);

      drawFullTapeTrack(ctx, pFree, kFree, padL, 86, 34, pxPerCm, circled, true, W - padR);
    }

    function drawFullTapeTrack(ctx, phys, kin, padL, fullY, fullH, pxPerCm, circled, showRuler, rightEdgeX) {
      const stripBgColors = [
        '#dbeafe', '#dcfce7', '#fef9c3', '#ffedd5', '#f3e8ff',
        '#ccfbf1', '#fee2e2', '#e0f2fe', '#fae8ff', '#d1fae5', '#fef3c7', '#e0e7ff'
      ];
      const dps = phys.dotsPerStrip;

      phys.strips.forEach((st, i) => {
        if (kin.x <= st.startCm) return;
        const curEnd = Math.min(kin.x, st.endCm);
        const x0 = padL + st.startCm * pxPerCm;
        const w = Math.max(2, (curEnd - st.startCm) * pxPerCm);

        ctx.fillStyle = stripBgColors[i % stripBgColors.length];
        ctx.fillRect(x0, fullY, w, fullH);
        ctx.strokeStyle = '#475569';
        ctx.lineWidth = 1.2;
        ctx.strokeRect(x0, fullY, w, fullH);

        if (kin.x >= st.endCm && !st.isPartial) {
          ctx.fillStyle = '#f8fafc';
          ctx.font = 'bold 11px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(circled[i] || `(${i + 1})`, x0 + w / 2, fullY - 4);

          if (w > 26) {
            ctx.fillStyle = '#38bdf8';
            ctx.font = 'bold 9.5px Consolas, monospace';
            ctx.fillText(`${st.length.toFixed(1)}cm`, x0 + w / 2, fullY + fullH + 12);
          }

          ctx.strokeStyle = '#ef4444';
          ctx.lineWidth = 1.4;
          ctx.setLineDash([3, 2]);
          ctx.beginPath();
          ctx.moveTo(x0 + w, fullY - 4);
          ctx.lineTo(x0 + w, fullY + fullH + 4);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      });

      const dotInt = Math.floor(kin.d);
      for (let d = 0; d <= dotInt; d++) {
        const kd = getAtDot(d, phys);
        const x = padL + kd.x * pxPerCm;
        const isCut = d % dps === 0;
        ctx.fillStyle = isCut ? '#dc2626' : '#0f172a';
        ctx.beginPath();
        ctx.arc(x, fullY + fullH / 2, isCut ? 2.5 : 1.7, 0, Math.PI * 2);
        ctx.fill();
      }

      if (showRuler) {
        const rulerY = fullY + fullH + 18;
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(padL, rulerY);
        ctx.lineTo(rightEdgeX, rulerY);
        ctx.stroke();

        const maxCm = (rightEdgeX - padL) / pxPerCm;
        const rulerStep = maxCm > 1200 ? 200 : maxCm > 600 ? 100 : maxCm > 350 ? 50 : maxCm > 150 ? 25 : 10;
        for (let cm = 0; cm <= maxCm; cm += rulerStep) {
          const rx = padL + cm * pxPerCm;
          ctx.strokeStyle = '#64748b';
          ctx.beginPath();
          ctx.moveTo(rx, rulerY);
          ctx.lineTo(rx, rulerY + 4);
          ctx.stroke();
          ctx.fillStyle = '#64748b';
          ctx.font = '10px Consolas, monospace';
          ctx.textAlign = 'center';
          const rTxt = isFreeMeterMode() ? `${+(cm / 100).toFixed(2)}m` : `${cm}cm`;
          ctx.fillText(rTxt, rx, rulerY + 13);
        }
      }
      ctx.textAlign = 'left';
    }

    // =========================================================
    // 3. 台紙グラフ モーダル描画
    // =========================================================
    function drawChartModal() {

              shortLabel: `記録${idx + 1} (${rec.timerHz}Hz/${rec.heightCm}cm/${rec.angleDeg}°/${formatRecordFlatSummary(rec)})`,
              phys: rec.phys,
              strips: rec.phys.strips.filter(s => !s.isPartial),
              color: rec.color
            }))
          : [{
              label: `現在の実験1 (${state.timerHz}Hz, h=${state.heightCm}cm, θ=${state.angleDeg}°, ${curFlatDesc} ※未記録)`,
              shortLabel: `現在 (${state.timerHz}Hz/${state.heightCm}cm/${state.angleDeg}°/${curFlatDesc})`,
              phys: curPhys,
              strips: curPhys.strips.filter(s => !s.isPartial),
              color: '#38bdf8'
            }];

        let maxLen = 15;
        list.forEach(item => {
          item.strips.forEach(st => {
            if (st.length > maxLen) maxLen = st.length;
          });
        });
        const commonMax = Math.ceil((maxLen + 3) / 5) * 5;

        const nGraphs = list.length;
        const gap = 10;
        const graphW = (W - 20 - gap * (nGraphs - 1)) / nGraphs;

        list.forEach((item, idx) => {
          const ox = 10 + idx * (graphW + gap);
          drawPasteGraph(ctx, ox, 10, graphW, H - 20, item.strips, item.label, item.color, commonMax);
        });

        titleEl.textContent = state.savedRecords.length > 0
          ? `📋 記録した実験1の結果比較（${state.savedRecords.length}個 / 同一縦軸スケールで比較）`
          : `📋 現在の実験1データ（※[📌 現在の実験1を記録] を押すと最大3個まで並べて比較できます）`;

        const maxCols = Math.max(1, ...list.map(it => it.strips.length));
        const colHeaders = Array.from({ length: maxCols }, (_, i) => `<th>${circled[i] || i + 1}</th>`).join('');

        tbl.innerHTML = `
          <thead>
            <tr>
              <th>条件 / 項目</th>
              <th>ΔL [cm]</th>
              <th>終端速度 [cm/s]</th>
              ${colHeaders}
            </tr>
          </thead>
          <tbody>
            ${list.map(it => `
              <tr>
                <th style="color:${it.color};">${it.shortLabel} 長さ[cm]</th>
                <td style="color:${it.color}; font-weight:700;">+${it.phys.dL.toFixed(2)}</td>
                <td style="color:#fbbf24; font-weight:700;">${it.phys.finalSpeed.toFixed(0)}</td>
                ${Array.from({ length: maxCols }, (_, i) => `<td>${it.strips[i] ? it.strips[i].length.toFixed(1) : '-'}</td>`).join('')}
              </tr>
              <tr>
                <th style="color:${it.color}; opacity:0.85;">${it.shortLabel} 速さ[cm/s]</th>
                <td>-</td>
                <td>-</td>
                ${Array.from({ length: maxCols }, (_, i) => `<td style="color:#cbd5e1;">${it.strips[i] ? it.strips[i].avgSpeed.toFixed(0) : '-'}</td>`).join('')}
              </tr>
            `).join('')}
          </tbody>
        `;
      } else {
        const p1 = getSinglePhysics(1, state.heightCm, state.angleDeg, state.timerHz);
        const p2 = getSinglePhysics(2, state.heightCm, 90, state.timerHz);
        const s1 = p1.strips.filter(s => !s.isPartial);
        const s2 = p2.strips.filter(s => !s.isPartial);

        const maxLen = Math.max(
          s1[s1.length - 1]?.length || 15,
          s2[s2.length - 1]?.length || 15
        );
        const commonMax = Math.ceil((maxLen + 5) / 5) * 5;
        drawPasteGraph(ctx, 10, 10, W / 2 - 14, H - 20, s1, `実験1：斜面 (${state.timerHz}Hz: ${p1.dotsPerStrip}打点, h=${state.heightCm}cm, θ=${state.angleDeg}°)`, '#3b82f6', commonMax);
        drawPasteGraph(ctx, W / 2 + 4, 10, W / 2 - 14, H - 20, s2, `実験2：自由落下 (${state.timerHz}Hz: ${p2.dotsPerStrip}打点, h=${state.heightCm}cm, 90°)`, '#f97316', commonMax);

        titleEl.textContent = `📋 同じ高さ (h=${state.heightCm}cm, ${state.timerHz}Hz) での斜面と自由落下のデータ比較`;
        const maxCols = Math.max(s1.length, s2.length);
        const colHeaders = Array.from({ length: maxCols }, (_, i) => `<th>${circled[i] || i + 1}</th>`).join('');

        tbl.innerHTML = `
          <thead>
            <tr>
              <th>テープ番号 (0.1秒ごと)</th>
              <th>ΔL [cm]</th>
              <th>終端速度</th>
              ${colHeaders}
            </tr>
          </thead>
          <tbody>
            <tr>
              <th style="color:#60a5fa;">📘 斜面 (${state.angleDeg}°) 長さ [cm]</th>
              <td style="color:#60a5fa; font-weight:700;">+${p1.dL.toFixed(2)}</td>
              <td style="color:#fbbf24; font-weight:700;">${p1.finalSpeed.toFixed(0)}</td>
              ${Array.from({ length: maxCols }, (_, i) => `<td>${s1[i] ? s1[i].length.toFixed(1) : '-'}</td>`).join('')}
            </tr>
            <tr>
              <th style="color:#60a5fa;">📘 斜面 速さ [cm/s]</th>
              <td>-</td>
              <td>-</td>
              ${Array.from({ length: maxCols }, (_, i) => `<td>${s1[i] ? s1[i].avgSpeed.toFixed(0) : '-'}</td>`).join('')}
            </tr>
            <tr>
              <th style="color:#fb923c;">📙 自由落下 (90°) 長さ [cm]</th>
              <td style="color:#fb923c; font-weight:700;">+${p2.dL.toFixed(2)}</td>
              <td style="color:#fbbf24; font-weight:700;">${p2.finalSpeed.toFixed(0)}</td>
              ${Array.from({ length: maxCols }, (_, i) => `<td>${s2[i] ? s2[i].length.toFixed(1) : '-'}</td>`).join('')}
            </tr>
            <tr>
              <th style="color:#fb923c;">📙 自由落下 速さ [cm/s]</th>
              <td>-</td>
              <td>-</td>
              ${Array.from({ length: maxCols }, (_, i) => `<td>${s2[i] ? s2[i].avgSpeed.toFixed(0) : '-'}</td>`).join('')}
            </tr>
          </tbody>
        `;
      }
    }

    function drawPasteGraph(ctx, ox, oy, bw, bh, strips, title, accent, maxCm) {
      const padL = 46;
      const padR = 12;
      const padT = 32;
      const padB = 38;
      const px = ox + padL;
      const py = oy + padT;
      const pw = bw - padL - padR;
      const ph = bh - padT - padB;

      ctx.fillStyle = accent;
      ctx.font = 'bold 11.5px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(title, px - 10, oy + 20);

      const stepCm = maxCm > 40 ? 5 : maxCm > 20 ? 2 : 1;
      const majorCm = maxCm > 40 ? 10 : 5;

      for (let cm = 0; cm <= maxCm; cm += stepCm) {
        const y = py + ph - (cm / maxCm) * ph;
        const isMajor = cm % majorCm === 0;
        ctx.strokeStyle = isMajor ? '#64748b' : '#1e293b';
        ctx.lineWidth = isMajor ? 1.3 : 0.8;
        ctx.beginPath();
        ctx.moveTo(px, y);
        ctx.lineTo(px + pw, y);
        ctx.stroke();

        if (isMajor) {
          ctx.fillStyle = '#cbd5e1';
          ctx.font = 'bold 10px Consolas, monospace';
          ctx.textAlign = 'right';
          ctx.fillText(`${cm}cm`, px - 5, y + 4);
        }
      }

      const n = Math.max(1, strips.length);
      const stripW = Math.min(44, pw / n);
      const circled = CIRCLED_NUMS.slice(1);

      strips.forEach((st, i) => {
        const x = px + i * stripW;
        ctx.fillStyle = '#e2e8f0';
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(circled[i] || i + 1, x + stripW / 2, py + ph + 16);

        const barH = (st.length / maxCm) * ph;
        const yTop = py + ph - barH;

        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(x + 1.5, yTop, stripW - 3, barH);
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 1.2;
        ctx.strokeRect(x + 1.5, yTop, stripW - 3, barH);

        st.innerDots.forEach((dotCm, dIdx) => {
          if (dIdx === 0) return;
          const dy = py + ph - (dotCm / maxCm) * ph;
          ctx.fillStyle = '#090d16';
          ctx.beginPath();
          ctx.arc(x + stripW / 2, dy, 1.8, 0, Math.PI * 2);
          ctx.fill();
        });

        if (stripW >= 20) {
          ctx.fillStyle = accent;
          ctx.font = 'bold 9px Consolas, monospace';
          ctx.fillText(st.length.toFixed(1), x + stripW / 2, yTop - 4);
        }
      });

      if (strips.length >= 2) {
        ctx.strokeStyle = accent;
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        strips.forEach((st, idx) => {
          const cx = px + (idx + 0.5) * stripW;
          const cy = py + ph - (st.length / maxCm) * ph;
          if (idx === 0) ctx.moveTo(cx, cy);
          else ctx.lineTo(cx, cy);
        });
        ctx.stroke();
      }

      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(px, py, pw, ph);
    }

    // =========================================================
    // エネルギー表示窓のマウスドラッグ移動 ＆ 8方向リサイズ
    // =========================================================
    function clampEnergyPanelToStage() {
      const panel = document.getElementById('energyPanel');
      const stage = document.getElementById('simStage');
      if (!panel || !stage || panel.classList.contains('hidden')) return;

      const stageW = stage.clientWidth;
      const stageH = stage.clientHeight;
      if (stageW <= 0 || stageH <= 0) return;

      const minW = 280;
      const minH = 175;
      let w = Math.max(minW, Math.min(stageW - 12, panel.offsetWidth));
      let h = Math.max(minH, Math.min(stageH - 12, panel.offsetHeight));
      let l = Math.max(4, Math.min(stageW - w - 4, panel.offsetLeft));
      let t = Math.max(4, Math.min(stageH - h - 4, panel.offsetTop));

      panel.style.width = `${w}px`;
      panel.style.height = `${h}px`;
      panel.style.left = `${l}px`;
      panel.style.top = `${t}px`;
    }

    function initEnergyPanelDragResize() {
      const panel = document.getElementById('energyPanel');
      const header = document.getElementById('energyPanelHeader');
      const stage = document.getElementById('simStage');
      const resizers = panel.querySelectorAll('.energy-resizer');

      let mode = null; // 'drag' | 'resize'
      let resizeDir = '';
      let startMouseX = 0;
      let startMouseY = 0;
      let startLeft = 0;
      let startTop = 0;
      let startWidth = 0;
      let startHeight = 0;

      // ヘッダードラッグで移動
      header.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        mode = 'drag';
        startMouseX = e.clientX;
        startMouseY = e.clientY;
        startLeft = panel.offsetLeft;
        startTop = panel.offsetTop;
        panel.classList.add('dragging');
        e.preventDefault();
      });

      // 8方向リサイズハンドルで拡大縮小
      resizers.forEach((handle) => {
        handle.addEventListener('mousedown', (e) => {
          if (e.button !== 0) return;
          mode = 'resize';
          resizeDir = handle.dataset.dir || 'se';
          startMouseX = e.clientX;
          startMouseY = e.clientY;
          startLeft = panel.offsetLeft;
          startTop = panel.offsetTop;
          startWidth = panel.offsetWidth;
          startHeight = panel.offsetHeight;
          panel.classList.add('resizing');
          e.preventDefault();
          e.stopPropagation();
        });
      });

      window.addEventListener('mousemove', (e) => {
        if (!mode) return;
        const stageW = stage.clientWidth;
        const stageH = stage.clientHeight;
        const dx = e.clientX - startMouseX;
        const dy = e.clientY - startMouseY;

        if (mode === 'drag') {
          const w = panel.offsetWidth;
          const h = panel.offsetHeight;
          const nextLeft = Math.max(4, Math.min(stageW - w - 4, startLeft + dx));
          const nextTop = Math.max(4, Math.min(stageH - h - 4, startTop + dy));
          panel.style.left = `${nextLeft}px`;
          panel.style.top = `${nextTop}px`;
        } else if (mode === 'resize') {
          const minW = 280;
          const minH = 175;
          let newLeft = startLeft;
          let newTop = startTop;
          let newW = startWidth;
          let newH = startHeight;

          if (resizeDir.includes('e')) {
            newW = Math.max(minW, Math.min(stageW - startLeft - 4, startWidth + dx));
          }
          if (resizeDir.includes('s')) {
            newH = Math.max(minH, Math.min(stageH - startTop - 4, startHeight + dy));
          }
          if (resizeDir.includes('w')) {
            const maxLeft = startLeft + startWidth - minW;
            newLeft = Math.max(4, Math.min(maxLeft, startLeft + dx));
            newW = startWidth + (startLeft - newLeft);
          }
          if (resizeDir.includes('n')) {
            const maxTop = startTop + startHeight - minH;
            newTop = Math.max(4, Math.min(maxTop, startTop + dy));
            newH = startHeight + (startTop - newTop);
          }

          panel.style.left = `${newLeft}px`;
          panel.style.top = `${newTop}px`;
          panel.style.width = `${newW}px`;
          panel.style.height = `${newH}px`;

          // キャンバスを即座にリサイズして再描画
          if (state.showEnergyGraph) {
            const pSlope = getSinglePhysics(1);
            const pFree = getSinglePhysics(2);
            const kSlope = getAtDot(state.currentDot, pSlope);
            const kFree = getAtDot(state.currentDot, pFree);
            drawEnergyPanel(pSlope, kSlope, pFree, kFree);
          }
        }
      });

      window.addEventListener('mouseup', () => {
        if (!mode) return;
        mode = null;
        panel.classList.remove('dragging', 'resizing');
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      initEnergyPanelDragResize();
      setExperiment(1);
      updateSavedRecordsUI();
      resizeAllCanvases();
    });
  </script>
