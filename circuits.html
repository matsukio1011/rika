<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>電気回路シミュレーター</title><meta name="description" content="回路を見て、触って、オームの法則を理解しよう。"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2315253f'/%3E%3Cpath d='M18 3 8 18h8l-2 11 11-17h-9z' fill='%23ffd260'/%3E%3C/svg%3E"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:'Yu Gothic UI','Meiryo',sans-serif;color:#172840;background:#eef3f9}body{height:100dvh;display:flex;flex-direction:column;padding:clamp(12px,2vw,28px);gap:18px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex:none}h1{font-size:22px;margin:0}button,input{font:inherit}button{border:0;border-radius:10px;padding:10px 16px;cursor:pointer;background:#e8eff8;color:#172840;font-weight:700}button:hover{filter:brightness(.95)}button:focus-visible,input:focus-visible{outline:3px solid #246dce;outline-offset:3px}main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;flex:1;min-height:0}.circuit{min-height:0;min-width:0;border-radius:22px;background:#15253f;color:white;padding:22px;display:flex;flex-direction:column}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex:none}.tag{color:#ffda79;font-weight:700}.circuit svg{width:100%;flex:1;min-height:0;display:block}.wire{fill:none;stroke:#95aac6;stroke-width:4;stroke-linejoin:round}.part{stroke:#ffcf68;stroke-width:4;fill:#24364e}.svgtext{fill:#fff;font-size:24px;font-family:inherit}.smalltext{fill:#bdd0e9;font-size:18px}.flow{fill:none;stroke:#66e1d4;stroke-width:5;stroke-dasharray:2 27;stroke-linecap:round;animation:flow 3s linear infinite}@keyframes flow{to{stroke-dashoffset:-290}}.paused .flow{animation-play-state:paused}.no-current .flow{display:none}.panel{min-height:0;background:white;border-radius:22px;padding:22px;display:flex;flex-direction:column;justify-content:space-between;gap:14px}.controls{display:grid;gap:12px}label{display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:700}output{color:#185ad7;font-size:23px}input[type=range]{width:100%;accent-color:#185ad7;cursor:pointer;margin:10px 0 0;height:24px}.results{border-top:1px solid #dbe3ee;padding-top:14px}.resultlabel{font-size:15px;color:#53647b}.voltage{font-size:clamp(32px,5vh,52px);font-weight:800;color:#185ad7;line-height:1.25;margin:4px 0 12px}.total{display:flex;justify-content:space-between;gap:10px;font-size:16px}.parts{display:flex;justify-content:space-between;gap:12px;margin-top:12px;font-size:15px}.parts span:first-child{border-left:4px solid #ffda80;padding-left:8px}.parts span:last-child{border-left:4px solid #82ded5;padding-left:8px}.voltagebar{height:14px;display:flex;border-radius:6px;overflow:hidden;margin-top:10px}.voltagebar span:first-child{background:#ffda80}.voltagebar span:last-child{background:#82ded5}#reset{width:100%}@media(min-width:850px) and (max-height:650px){body{padding:12px;gap:10px}.panel,.circuit{padding:16px}.controls{gap:8px}.panel{gap:8px}.voltage{font-size:32px;margin:0 0 6px}.results{padding-top:8px}.parts{margin-top:6px}input[type=range]{margin-top:4px}button{padding:8px 14px}}@media(max-width:849px){body{height:auto;min-height:100dvh}main{grid-template-columns:1fr}.circuit{height:52vh;min-height:270px}.panel{gap:20px}h1{font-size:19px}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}.ohm{font-family:Arial,"Segoe UI Symbol",sans-serif;font-weight:400}#r1out,#r2out,#total{font-family:Arial,"Segoe UI Symbol",sans-serif;font-weight:400}.svgtext.ohm{font-family:Arial,"Segoe UI Symbol",sans-serif}.droptext{font-family:Arial,sans-serif;font-size:23px;font-weight:600;fill:#ffda80}.count-selector{display:flex;align-items:center;gap:8px;font-size:16px}.count-selector button{padding:8px 16px}.count-selector button[aria-pressed=true]{background:#185ad7;color:white}.controls{gap:6px}.resistance-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}.resistance-controls output{font-family:Arial,sans-serif;font-weight:400;font-size:20px}.parts{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:14px}.parts span{padding-left:8px;border-left:4px solid var(--color)}.parts span:first-child,.parts span:last-child{border-color:var(--color)}input[type=range]{margin-top:5px}.droptext{font-size:20px}@media(max-width:849px){header{flex-wrap:wrap}.resistance-controls{gap:12px}}@media(min-width:850px) and (max-height:650px){.panel{padding:12px}.controls{gap:4px}.resistance-controls{gap:4px 14px}output{font-size:20px}.voltage{font-size:28px}.parts{margin-top:4px}.results{padding-top:4px}.voltagebar{margin-top:6px}}header{flex-wrap:wrap}.branch-current{fill:#82ded5;font:18px Arial,sans-serif}.parallel-label{fill:#fff;font:20px Arial,sans-serif}.integer-actions{display:grid;gap:8px}.integer-actions button{background:#eaf1ff;color:#185ad7;padding:9px 8px;font-size:15px}[hidden]{display:none!important}body.quiz-active main>.panel:not(.quiz-panel){display:none}#quizToggle[aria-pressed=true]{background:#185ad7;color:white}.quiz-panel h2{margin:0 0 18px;font-size:24px}.quiz-panel p{line-height:1.8}.quiz-panel input{width:100%;padding:12px;margin:16px 0;border:1px solid #9aaec9;border-radius:10px;font:inherit}.quiz-panel form button{width:100%;background:#185ad7;color:white}#quizFeedback{min-height:60px;font-weight:700}#quizNext{color:#185ad7}.quiz-active .integer-actions{display:none}.quiz-choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.quiz-choices button{min-height:65px;font:700 22px Arial,sans-serif;background:#eaf1ff;color:#185ad7}.quiz-choices button.correct{background:#d4f4e8;color:#126146}.quiz-choices button.wrong{background:#ffe2e2;color:#a22}.quiz-choices button:disabled{cursor:default}.quiz-given{fill:#82ded5;font:21px Arial,sans-serif}.display-actions{display:flex;gap:8px;margin-left:auto}.display-actions button{font-size:14px;padding:8px 12px}html.dark,html.dark body{background:#0c1423;color:#e7eef9;color-scheme:dark}html.dark .panel{background:#1b2940}html.dark button{background:#2a3b56;color:#e7eef9}html.dark .resultlabel{color:#bdcbe0}html.dark output,html.dark .voltage{color:#88baff}html.dark .results{border-color:#40516b}html.dark .integer-actions button,html.dark .quiz-choices button{background:#263e60;color:#a9ceff}html.dark .quiz-choices button.correct{background:#194e42;color:#a7f3d0}html.dark .quiz-choices button.wrong{background:#612d3a;color:#ffd0d9}html.dark button[aria-pressed=true]{background:#2866d8;color:white}:fullscreen{background:#eef3f9}html.dark:fullscreen{background:#0c1423}@media(min-width:850px){header{gap:10px}.count-selector{gap:5px}.count-selector button{padding:8px 10px}h1{font-size:20px}}.portal-back{color:#185ad7;font-size:14px;font-weight:700;text-decoration:none}html.dark .portal-back{color:#a9ceff}</style></head><body><header><a class="portal-back" href="./index.html">← アプリ一覧</a><h1>⚡ 電気回路シミュレーター</h1><div class="count-selector" role="group" aria-label="回路の種類"><button data-type="series" aria-pressed="true">直列</button><button data-type="parallel" aria-pressed="false">並列</button><button data-type="mixed" aria-pressed="false">混合</button><button id="quizRandom" aria-pressed="false" hidden>ランダム</button></div><div class="count-selector" role="group" aria-label="抵抗の数"><span>抵抗の数</span><button data-count="2" aria-pressed="true">2個</button><button data-count="3" aria-pressed="false">3個</button><button data-count="4" aria-pressed="false">4個</button></div><button id="quizToggle" aria-pressed="false">クイズモード</button><div class="display-actions"><button id="fullscreenToggle" aria-pressed="false">全画面</button><button id="darkToggle" aria-pressed="false">ダークモード</button></div></header><main><section class="circuit" aria-label="直列回路"><div class="topline"><span class="tag" id="mode">問題の回路</span><button id="pause" aria-pressed="false">動きを止める</button></div><svg viewBox="0 0 580 370" role="img" aria-labelledby="diagramTitle"><title id="diagramTitle">8オームと6オームの抵抗が直列につながり、0.2アンペアの電流が流れる回路</title><path class="wire" d="M270 65H70V265H510V65H310"/><path class="flow" d="M315 65H510V265H70V65H265"/><path stroke="#fff" stroke-width="5" d="M278 45V85M302 30V100"/><text x="264" y="25" class="smalltext">−</text><text x="310" y="35" class="smalltext">＋</text><text id="battery" x="290" y="139" text-anchor="middle" class="svgtext">電圧 V = ?</text><g id="resistors"></g><text id="current" x="458" y="175" text-anchor="end" class="svgtext" fill="#66e1d4">0.2 A</text><path d="M475 146v45m-7-9 7 9 7-9" fill="none" stroke="#66e1d4" stroke-width="3"/></svg></section><section class="panel" aria-label="回路の操作"><div class="controls"><div><label for="volts">電池の電圧 <output id="voltsout"></output></label><input id="volts" type="range" min="0" max="40" step="0.1" value="2.8"></div><div class="resistance-controls" id="resistanceControls"></div><div><label for="amps">電流 <output id="ampsout"></output></label><input id="amps" type="range" min="0" max="1" step="0.001" value="0.2"></div></div><div class="results" aria-live="polite"><div class="resultlabel">電池の電圧</div><div class="voltage" id="result"></div><div class="total"><span>合成抵抗</span><strong id="total"></strong></div><div class="parts" id="parts"></div><div class="voltagebar" id="voltagebar"></div></div><div class="integer-actions"><button id="integerVoltage">電圧をすべて整数に</button><button id="integerCurrent">電流をすべて整数に</button></div></section><section class="panel quiz-panel" id="quizPanel" hidden><div><h2>回路クイズ</h2><p id="quizQuestion"></p><p id="quizGiven"></p></div><div><div id="quizChoices" class="quiz-choices" role="group" aria-label="答えの選択肢"></div><p id="quizFeedback" role="status"></p></div><button id="quizNext">次の問題</button></section></main><script>
const $=id=>document.getElementById(id),f=n=>Number(n.toFixed(3)).toString(),names=['①','②','③','④'],colors=['#ffda80','#82ded5','#b5b6ff','#ffaaa8'];let topology='series';const seriesDiagram=document.querySelector('.circuit svg').innerHTML;let count=2,resistances=[8,6,4,2],source='current',voltage=2.8,current=.2;
function buildControls(){document.querySelector('[aria-label="抵抗の数"]').style.display=topology==='mixed'?'none':'flex'; $('resistanceControls').innerHTML=resistances.slice(0,count).map((r,k)=>'<div><label for="r'+k+'">抵抗'+(topology==='mixed'?['B','C','D'][k]:names[k])+' <output id="rout'+k+'"></output></label><input id="r'+k+'" type="range" min="1" max="60" step="1" value="'+r+'"></div>').join('');for(let k=0;k<count;k++)$('r'+k).oninput=()=>{resistances[k]=+$('r'+k).value;render()};document.querySelectorAll('[data-count]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.count===count)));render()}
function render(){if(topology==='mixed'){renderMixed();return}const rs=resistances.slice(0,count),total=topology==='series'?rs.reduce((a,b)=>a+b,0):1/rs.reduce((a,b)=>a+1/b,0);if(source==='voltage')current=voltage/total;else voltage=current*total;
if(topology==='parallel'){document.querySelector('.circuit svg').innerHTML='<title id="diagramTitle"></title><path class="wire" d="M270 48H65V'+(125+(count-1)*65)+'M310 48H515V'+(125+(count-1)*65)+'"/><path class="flow" d="M310 48H515V'+(125+(count-1)*65)+'"/><path class="flow" d="M65 '+(125+(count-1)*65)+'V48H270"/><path stroke="#fff" stroke-width="5" d="M278 28V68M302 15V81"/><text x="259" y="23" class="smalltext">−</text><text x="313" y="23" class="smalltext">＋</text><text id="battery" x="290" y="-12" text-anchor="middle" class="parallel-label"></text><text id="current" x="405" y="94" text-anchor="middle" class="branch-current"></text><g id="resistors"></g>'}else{document.querySelector('.circuit svg').innerHTML=seriesDiagram}document.querySelector('.circuit svg').setAttribute('viewBox',topology==='parallel'?'0 -40 580 410':'0 0 580 370');document.querySelector('.circuit').classList.toggle('no-current',current===0);document.querySelector('.circuit').setAttribute('aria-label',topology==='series'?'直列回路':'並列回路');$('voltagebar').hidden=topology==='parallel';$('voltagebar').style.display=topology==='parallel'?'none':'flex';const topY=topology==='parallel'?48:65;document.querySelector('.circuit svg').insertAdjacentHTML('beforeend','<g aria-label="電池から出る電流と戻る電流"><path d="M365 '+topY+'H445m-9-6 9 6-9 6M125 '+topY+'H205m-9-6 9 6-9 6" fill="none" stroke="#82ded5" stroke-width="3"/><text x="405" y="'+(topY-15)+'" text-anchor="middle" class="branch-current">'+f(current)+' A</text><text x="165" y="'+(topY-15)+'" text-anchor="middle" class="branch-current">'+f(current)+' A</text></g>');$('battery').textContent='電圧 '+f(voltage)+' V';$('current').textContent=topology==='parallel'?'':f(current)+' A';$('diagramTitle').textContent=count+'個の'+(topology==='series'?'直列':'並列')+'抵抗。合成抵抗'+f(total)+'オーム。電流'+f(current)+'アンペア。'+rs.map((r,k)=>'抵抗'+names[k]+'は'+r+'オーム、'+f(topology==='series'?r*current:voltage)+'ボルト。').join('');$('mode').textContent=topology==='series'&&count===2&&rs[0]===8&&rs[1]===6&&Math.abs(current-.2)<1e-9?'問題の回路':(topology==='series'?'直列':'並列')+'回路 · 抵抗'+count+'個';
$('resistors').innerHTML=topology==='parallel'?rs.map((r,k)=>{const y=125+k*65;return '<path class="wire" d="M65 '+y+'H515"/><path class="flow" d="M515 '+y+'H65"/><rect x="235" y="'+(y-14)+'" width="110" height="28" class="part" style="stroke:'+colors[k]+'"/><text x="290" y="'+(y+7)+'" text-anchor="middle" class="parallel-label">'+r+' Ω</text><text x="85" y="'+(y-12)+'" class="smalltext">抵抗'+names[k]+'</text><text x="415" y="'+(y-10)+'" text-anchor="middle" class="branch-current">← '+f(voltage/r)+' A</text><text x="290" y="'+(y+37)+'" text-anchor="middle" class="droptext" style="fill:'+colors[k]+'">'+f(voltage)+' V</text>'}).join(''):rs.map((r,k)=>{const x=70+440*(k+.5)/count,w=Math.min(100,320/count);return '<rect class="part" x="'+(x-w/2)+'" y="248" width="'+w+'" height="34" style="stroke:'+colors[k]+'"/><text x="'+x+'" y="230" text-anchor="middle" class="ohm svgtext">'+r+' Ω</text><text x="'+x+'" y="313" text-anchor="middle" class="smalltext">抵抗'+names[k]+'</text><text x="'+x+'" y="344" text-anchor="middle" class="droptext" style="fill:'+colors[k]+'">'+f(topology==='series'?r*current:voltage)+' V</text>'}).join('');rs.forEach((r,k)=>$('rout'+k).textContent=r+' Ω');$('voltsout').textContent=f(voltage)+' V';$('volts').max=Math.max(40,voltage);$('volts').value=voltage;$('volts').setAttribute('aria-valuetext',f(voltage)+' V');$('ampsout').textContent=f(current)+' A';$('amps').max=Math.max(1,Math.ceil(current));$('amps').value=current;$('amps').setAttribute('aria-valuetext',f(current)+' A');$('result').textContent=f(voltage)+' V';$('total').textContent=f(total)+' Ω';$('parts').innerHTML=rs.map((r,k)=>'<span style="--color:'+colors[k]+'">抵抗'+names[k]+' <strong>'+f(topology==='series'?r*current:voltage)+' V</strong></span>').join('');$('voltagebar').innerHTML=rs.map((r,k)=>'<span style="width:'+(topology==='series'?r/total:1/count)*100+'%;background:'+colors[k]+'"></span>').join('');$('voltagebar').setAttribute('aria-label',rs.map((r,k)=>'抵抗'+names[k]+' '+f(topology==='series'?r*current:voltage)+'ボルト').join('、'));
}

function renderMixed(){
const [b,c,d]=resistances,rp=b*c/(b+c),total=rp+d;if(source==='voltage')current=voltage/total;else voltage=current*total;const vp=current*rp,vd=current*d,ib=vp/b,ic=vp/c;
const txt=(x,y,s,cl='branch-current')=>'<text x="'+x+'" y="'+y+'" text-anchor="middle" class="'+cl+'">'+s+'</text>';
const resistor=(x,y,r,label,v,color)=>'<rect class="part" x="'+(x-42)+'" y="'+(y-14)+'" width="84" height="28" style="stroke:'+color+'"/>'+txt(x,y-25,label+' '+r+' Ω','parallel-label')+txt(x,y+40,f(v)+' V','droptext');
const wire='M270 300H40V155H90M90 155V85H300V155H520V300H310M90 155V215H300V155';
const flows=['M270 300H40V155H90','M90 155V85H300V155','M90 155V215H300V155','M300 155H520V300H310'];
document.querySelector('.circuit svg').innerHTML='<title id="diagramTitle">混合回路。BとCの並列回路にDを直列接続。合成抵抗'+f(total)+'オーム。</title><path class="wire" d="'+wire+'"/>'+flows.map(s=>'<path class="flow" d="'+s+'"/>').join('')+'<path stroke="#fff" stroke-width="5" d="M278 274V326M302 284V316"/>'+txt(260,272,'＋','smalltext')+txt(320,279,'−','smalltext')+resistor(190,85,b,'B',vp,colors[0])+resistor(190,215,c,'C',vp,colors[1])+resistor(410,155,d,'D',vd,colors[2])+txt(190,145,'→ '+f(ib)+' A')+txt(190,272,'→ '+f(ic)+' A')+txt(420,226,'→ '+f(current)+' A')+txt(160,330,f(current)+' A')+txt(420,330,f(current)+' A')+txt(290,360,f(voltage)+' V','parallel-label')+'<path d="M190 300H120m9-6-9 6 9 6M455 300H385m9-6-9 6 9 6" fill="none" stroke="#82ded5" stroke-width="3"/>';
document.querySelector('.circuit svg').setAttribute('viewBox',topology==='parallel'?'0 -40 580 410':'0 0 580 370');document.querySelector('.circuit').classList.toggle('no-current',current===0);document.querySelector('.circuit').setAttribute('aria-label','混合回路');$('mode').textContent='混合回路 · BとCが並列、Dが直列';[b,c,d].forEach((r,k)=>$('rout'+k).textContent=r+' Ω');$('voltsout').textContent=f(voltage)+' V';$('volts').max=Math.max(40,voltage);$('volts').value=voltage;$('volts').setAttribute('aria-valuetext',f(voltage)+' V');$('ampsout').textContent=f(current)+' A';$('amps').max=Math.max(1,Math.ceil(current));$('amps').value=current;$('amps').setAttribute('aria-valuetext',f(current)+' A');$('result').textContent=f(voltage)+' V';$('total').textContent=f(total)+' Ω';$('parts').innerHTML=[vp,vp,vd].map((v,k)=>'<span style="--color:'+colors[k]+'">抵抗'+['B','C','D'][k]+' <strong>'+f(v)+' V</strong></span>').join('');$('voltagebar').style.display='none';
}
document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{const wasMixed=topology==='mixed';topology=b.dataset.type;if(topology==='mixed'){count=3;resistances=[20,30,8,2];source='voltage';voltage=10}else if(wasMixed){count=2;resistances=[8,6,4,2]}document.querySelectorAll('[data-type]').forEach(t=>t.setAttribute('aria-pressed',String(t.dataset.type===topology)));buildControls()});document.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{count=+b.dataset.count;buildControls()});$('amps').oninput=()=>{source='current';current=+$('amps').value;render()};$('volts').oninput=()=>{source='voltage';voltage=+$('volts').value;render()};$('pause').onclick=()=>{const paused=document.querySelector('.circuit').classList.toggle('paused');$('pause').textContent=paused?'動きを再開':'動きを止める';$('pause').setAttribute('aria-pressed',String(paused))};buildControls();

const pick=xs=>xs[Math.floor(Math.random()*xs.length)];
function integerExample(kind){const before=JSON.stringify([resistances.slice(0,count),voltage]);let candidate;
for(let attempt=0;attempt<100;attempt++){
let rs=[],v;
if(topology==='series'){
if(kind==='voltage'){rs=Array.from({length:count},()=>2*pick([1,2,3,4,5,6,7,8]));v=rs.reduce((a,b)=>a+b,0)*pick([.5,1,1.5]);}
else{rs=Array.from({length:count},()=>pick([1,2,3,4,5,6,8,10]));v=rs.reduce((a,b)=>a+b,0)*pick([1,2,3]);}
}else if(topology==='parallel'){
v=pick([6,12,18,24,30,36]);const choices=kind==='current'?[1,2,3,4,5,6,8,9,10,12,15,18].filter(r=>v%r===0):[2,3,4,5,6,7,8,9,10,12,15,20];rs=Array.from({length:count},()=>pick(choices));
}else{
if(kind==='voltage'){const vp=pick([2,4,6,8,10]),vd=pick([2,4,6,8,10]),pair=pick([[2,2],[3,6],[2,6]]),i=1/pair[0]+1/pair[1];rs=[vp*pair[0],vp*pair[1],Math.round(vd/i)];v=vp+vd;}
else{const vp=pick([6,12,18,24]),currents=[1,2,3,4,6].filter(i=>vp%i===0),ib=pick(currents),ic=pick(currents),d=pick([1,2,3,4,5,6]);rs=[vp/ib,vp/ic,d];v=vp+(ib+ic)*d;}
}
candidate={rs,v};if(JSON.stringify([rs,v])!==before)break;
}
resistances=candidate.rs.concat([2,2,2,2]).slice(0,4);source='voltage';voltage=candidate.v;buildControls();}
$('integerVoltage').onclick=()=>integerExample('voltage');$('integerCurrent').onclick=()=>integerExample('current');

let quizRandom=false,quizTimer=null;let quizActive=false,quizTarget='voltage',quizExpected=0,quizSolved=false;
function maskQuiz(){if(!quizActive)return;const svg=document.querySelector('.circuit svg');svg.querySelectorAll('.branch-current,.droptext').forEach(n=>n.remove());const battery=svg.querySelector('#battery');if(quizTarget==='voltage'){if(battery)battery.textContent='電圧 ? V';else{svg.querySelectorAll('.parallel-label').forEach(n=>{if(n.textContent.endsWith(' V'))n.textContent='? V'})}}const currentLabel=svg.querySelector('#current');if(currentLabel)currentLabel.textContent='';const title=svg.querySelector('title');if(title)title.textContent='クイズの回路';if(quizTarget==='voltage'){const y=topology==='mixed'?300:topology==='parallel'?48:65;svg.insertAdjacentHTML('beforeend','<text x="405" y="'+(y-16)+'" text-anchor="middle" class="quiz-given">'+f(current)+' A</text>')} $('mode').textContent=(topology==='series'?'直列':topology==='parallel'?'並列':'混合')+'回路 · クイズ';}
function newQuiz(){clearTimeout(quizTimer);quizTimer=null;if(quizRandom){topology=pick(['series','parallel','mixed']);count=topology==='mixed'?3:pick([2,3,4]);document.querySelectorAll('[data-type]').forEach(b=>b.setAttribute('aria-pressed','false'))}quizTarget=Math.random()<.5?'voltage':'current';integerExample('current');quizExpected=quizTarget==='voltage'?voltage:current;quizSolved=false;$('quizQuestion').textContent=quizTarget==='voltage'?'電池の電圧は何 V？':'電池を流れる全体の電流は何 A？';$('quizGiven').textContent='図の数値を使って、答えを選ぼう。';buildQuizChoices();$('quizFeedback').textContent='';maskQuiz();}
$('quizToggle').onclick=()=>{clearTimeout(quizTimer);quizTimer=null;quizActive=!quizActive;$('quizRandom').hidden=!quizActive;if(!quizActive){quizRandom=false;$('quizRandom').setAttribute('aria-pressed','false');document.querySelectorAll('[data-type]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.type===topology)))}document.body.classList.toggle('quiz-active',quizActive);$('quizPanel').hidden=!quizActive;$('quizToggle').setAttribute('aria-pressed',String(quizActive));$('quizToggle').textContent=quizActive?'シミュレーターに戻る':'クイズモード';if(quizActive)newQuiz();else render()};$('quizNext').onclick=newQuiz;
$('quizRandom').onclick=()=>{quizRandom=!quizRandom;$('quizRandom').setAttribute('aria-pressed',String(quizRandom));if(!quizRandom)document.querySelectorAll('[data-type]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.type===topology)));newQuiz()};
let quizAudioContext;
function playQuizSound(correct){try{const AudioContextClass=window.AudioContext||window.webkitAudioContext;if(!AudioContextClass)return;quizAudioContext??=new AudioContextClass();const context=quizAudioContext;const play=()=>{const now=context.currentTime;const notes=correct?[[659.25,0,.13],[830.61,.12,.13],[987.77,.24,.24]]:[[220,0,.16],[164.81,.17,.22]];notes.forEach(([frequency,offset,duration])=>{const oscillator=context.createOscillator(),gain=context.createGain();oscillator.type='sine';oscillator.frequency.value=frequency;gain.gain.setValueAtTime(0,now+offset);gain.gain.linearRampToValueAtTime(.12,now+offset+.012);gain.gain.exponentialRampToValueAtTime(.001,now+offset+duration);oscillator.connect(gain);gain.connect(context.destination);oscillator.start(now+offset);oscillator.stop(now+offset+duration+.02);oscillator.onended=()=>{oscillator.disconnect();gain.disconnect()}})};if(context.state==='suspended')context.resume().then(play).catch(()=>{});else play()}catch(e){}}
function buildQuizChoices(){const expected=Math.round(quizExpected),options=new Set([expected]);while(options.size<4){const candidate=Math.max(1,expected+pick([-9,-6,-4,-3,-2,-1,1,2,3,4,6,9]));options.add(candidate)}const shuffled=[...options];for(let k=shuffled.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[shuffled[k],shuffled[j]]=[shuffled[j],shuffled[k]]}const unit=quizTarget==='voltage'?'V':'A';$('quizChoices').innerHTML=shuffled.map(n=>'<button type="button" data-answer="'+n+'">'+n+' '+unit+'</button>').join('');$('quizChoices').querySelectorAll('button').forEach(button=>button.onclick=()=>{if(quizSolved)return;const answer=Number(button.dataset.answer);if(Math.abs(answer-quizExpected)<1e-8){quizSolved=true;playQuizSound(true);button.classList.add('correct');$('quizFeedback').textContent='正解だ！ '+f(quizExpected)+' '+unit;$('quizChoices').querySelectorAll('button').forEach(b=>b.disabled=true);$('quizFeedback').textContent+='　次の問題へ…';quizTimer=setTimeout(()=>{if(quizActive)newQuiz()},1100)}else{playQuizSound(false);button.classList.add('wrong');button.disabled=true;$('quizFeedback').textContent='もう一度！ '+(topology==='mixed'?'BとCをひとまとめにして、Dを足してみよう。':topology==='parallel'?'並列では各抵抗に同じ電圧がかかるぞ。':'直列の抵抗は足し算だぞ。')}})}
document.querySelectorAll('[data-type],[data-count]').forEach(b=>{const previous=b.onclick;b.onclick=()=>{clearTimeout(quizTimer);if(b.dataset.type){quizRandom=false;$('quizRandom').setAttribute('aria-pressed','false')}previous();if(quizActive)newQuiz()}});

const fullscreenButton=$('fullscreenToggle');fullscreenButton.onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){fullscreenButton.textContent='全画面にできません';setTimeout(()=>fullscreenButton.textContent='全画面',2500)}};document.addEventListener('fullscreenchange',()=>{const active=!!document.fullscreenElement;fullscreenButton.textContent=active?'全画面を終了':'全画面';fullscreenButton.setAttribute('aria-pressed',String(active))});function setDark(active){document.documentElement.classList.toggle('dark',active);$('darkToggle').setAttribute('aria-pressed',String(active));$('darkToggle').textContent=active?'ライトモード':'ダークモード';try{localStorage.setItem('circuit-dark',String(active))}catch(e){}}$('darkToggle').onclick=()=>setDark(!document.documentElement.classList.contains('dark'));try{setDark(localStorage.getItem('circuit-dark')==='true')}catch(e){}
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'configure_circuit',description:'2〜4個の直列抵抗と電池の電圧を設定する。',inputSchema:{type:'object',properties:{resistances:{type:'array',items:{type:'integer',minimum:1,maximum:20},minItems:2,maxItems:4},voltage:{type:'number',minimum:0,maximum:40}},required:['resistances','voltage'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(x){if(!x||!Array.isArray(x.resistances)||x.resistances.length<2||x.resistances.length>4||!x.resistances.every(r=>Number.isInteger(r)&&r>=1&&r<=20)||!Number.isFinite(x.voltage)||x.voltage<0||x.voltage>40)throw Error('抵抗は1〜20 Ωを2〜4個、電圧は0〜40 Vで指定。');topology='series';document.querySelectorAll('[data-type]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.type===topology)));count=x.resistances.length;x.resistances.forEach((r,k)=>resistances[k]=r);source='voltage';voltage=x.voltage;buildControls();return {count,voltage,current,resistance:x.resistances.reduce((a,b)=>a+b,0)}}})).catch(()=>{})}catch(e){}}
</script></body></html>
