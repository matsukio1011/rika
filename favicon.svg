<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Diagonal Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#3730a3" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Upward Cyan Force Arrow -->
    <linearGradient id="upArrowGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Downward Red Force Arrow -->
    <linearGradient id="downArrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.25" />

  <!-- Subtle physics vector grid lines -->
  <line x1="64" y1="256" x2="448" y2="256" stroke="#6366f1" stroke-width="3" stroke-dasharray="12,12" stroke-opacity="0.5" />
  <line x1="256" y1="64" x2="256" y2="448" stroke="#6366f1" stroke-width="3" stroke-dasharray="12,12" stroke-opacity="0.5" />

  <!-- Left Force Arrow (Upward - Tension/Normal force) -->
  <g id="fav-arrow-left">
    <line x1="105" y1="360" x2="105" y2="155" stroke="url(#upArrowGrad)" stroke-width="16" stroke-linecap="round" />
    <polygon points="105,123 81,165 129,165" fill="#38bdf8" />
    <circle cx="105" cy="360" r="10" fill="#38bdf8" />
  </g>

  <!-- Right Force Arrow (Downward - Gravity) -->
  <g id="fav-arrow-right">
    <line x1="407" y1="155" x2="407" y2="360" stroke="url(#downArrowGrad)" stroke-width="16" stroke-linecap="round" />
    <polygon points="407,392 383,350 431,350" fill="#ef4444" />
    <circle cx="407" cy="155" r="10" fill="#f59e0b" />
  </g>

  <!-- Center: Kanji 「力」 -->
  <text x="256" y="348" font-family="'Noto Sans JP', 'M PLUS Rounded 1c', 'Hiragino Sans', 'Meiryo', sans-serif" font-size="250" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#textShadow)">力</text>

  <!-- Center Action Point Dot (Golden Amber) -->
  <circle cx="256" cy="238" r="18" fill="#fbbf24" stroke="#ffffff" stroke-width="4" />
  <circle cx="256" cy="238" r="7" fill="#ffffff" />
</svg>
