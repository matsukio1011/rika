</style></head><body><header><div class="brand">理科ラボ</div><button id="theme" aria-pressed="false">ダークモード</button></header><main><h1>今日は、何を調べよう？</h1><p class="intro">図を動かして確かめる。クイズで力試し。</p><div class="apps"><a class="card" href="forces.html"><div class="art"><svg viewBox="0 0 400 150" aria-hidden="true"><path d="M105 20H295M200 20V70" stroke="#b9cae4" stroke-width="5"/><rect x="174" y="70" width="52" height="44" rx="4" fill="#93b7ff"/><path d="M150 105V38m-9 12 9-12 9 12" stroke="#7be1d0" stroke-width="5" fill="none"/><path d="M250 65V133m-9-12 9 12 9-12" stroke="#ffd274" stroke-width="5" fill="none"/></svg></div><div class="copy"><div class="topic">FORCE · 力</div><h2>力の関係性</h2><p>つり合い、作用・反作用、力の分解。矢印と図で、力のはたらきを確かめよう。</p><div class="tags"><span>4つのテーマ</span><span>図解・作図</span><span>4択テスト</span></div><div class="open">力のアプリを開く <span aria-hidden="true">→</span></div></div></a><a class="card" href="circuits.html"><div class="art circuit"><svg viewBox="0 0 400 150" aria-hidden="true"><path d="M185 30H85V115H315V30H215" fill="none" stroke="#7cdbd1" stroke-width="5"/><path d="M190 16V44M208 8V52" stroke="#fff" stroke-width="5"/><rect x="125" y="102" width="50" height="26" fill="#102d35" stroke="#ffd274" stroke-width="4"/><rect x="230" y="102" width="50" height="26" fill="#102d35" stroke="#b2aeff" stroke-width="4"/></svg></div><div class="copy"><div class="topic">ELECTRICITY · 電気</div><h2>電気回路</h2><p>抵抗や電圧を変えて、電流の変化を観察。直列・並列・混合回路に挑戦しよう。</p><div class="tags"><span>シミュレーター</span><span>4択クイズ</span><span>ランダム出題</span></div><div class="open">電気回路のアプリを開く <span aria-hidden="true">→</span></div></div></a></div></main><footer>中学理科 · 好きなテーマから始めよう。</footer><script>const button=document.getElementById('theme');function setTheme(dark){document.body.classList.toggle('dark',dark);button.textContent=dark?'ライトモード':'ダークモード';button.setAttribute('aria-pressed',String(dark));try{localStorage.setItem('rika-portal-dark',String(dark))}catch(e){}}button.onclick=()=>setTheme(!document.body.classList.contains('dark'));try{setTheme(localStorage.getItem('rika-portal-dark')==='true')}catch(e){}</script></body></html>
